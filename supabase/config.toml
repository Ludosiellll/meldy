# Supabase CLI settings for this repository. Used only to deploy Edge Functions (supabase/deploy_functions.py through
# .github/workflows/supabase-functions.yml); migrations go through supabase/migrate.py, and the site is on Hugging Face.
project_id = "meldy"

# The Telegram bot (docs/telegram-bot.md): Telegram and pg_net call it without a Supabase JWT; the webhook and the tick
# check their own HMAC headers (X-Telegram-Bot-Api-Secret-Token, x-meldy-tick). A deploy with verify_jwt = true would
# answer Telegram 401 and silence the bot.
[functions.telegram]
verify_jwt = false

# The token check of the owner's first bot step: called with the app's public key.
[functions.tg-health]
verify_jwt = true

# A question picture of a guest's quiz attempt (release 47, supabase/functions/_shared/quizMedia.ts): the site calls it
# with the app's public key; the device's token of the attempt is checked by quiz_guest_media_paths.
[functions.quiz-media]
verify_jwt = true
