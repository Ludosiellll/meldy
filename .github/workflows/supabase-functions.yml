name: Supabase functions

# Deploys the Edge Functions named on the newest line of deploy/supabase-functions.md to the live project with the
# Supabase CLI (supabase/deploy_functions.py): verify_jwt per function comes from supabase/config.toml, bundling goes
# through the Management API. The access token is the owner's, kept only in the repository secret SUPABASE_ACCESS_TOKEN.
on:
  push:
    branches: [claude/relaxed-hypatia-1tpmq5]
    paths: [deploy/supabase-functions.md]

concurrency:
  group: supabase-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: daunnytubqbzafjnpfnw
    steps:
      - name: Check the token secret
        run: test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is not set"; exit 1; }

      - uses: actions/checkout@v4

      # The bot's and quiz-media's own tests before anything goes live (reliability audit 07.11, REL-4: the release 55
      # bot went live 13 minutes before the site's gate had run these). The same commands as deploy-hf.yml's test job.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test the shared function code
        run: |
          node --experimental-strip-types --test supabase/functions/_shared/bot/*.test.ts supabase/functions/_shared/quizMedia.test.ts
          node scripts/sync_bot_plan.mjs --check

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The CLI is still «latest» (REL-5): its version goes into the log, so the next pin is the one that last worked.
      - name: Show the CLI version
        run: supabase --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deploy the functions on the newest line
        run: python supabase/deploy_functions.py
