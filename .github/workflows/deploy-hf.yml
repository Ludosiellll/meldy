name: Deploy to Hugging Face Space

# Release: a commit that changes deploy/hf-release.md on the working branch.
#   The Space receives a new commit on top of its live main (fast-forward, no force push):
#   the tree of the released GitHub commit without QA screenshots. The live main is tagged first.
# Check only: a commit that changes deploy/hf-check.md (and not hf-release.md) waits for the
#   Space's current main to run and smoke-checks it, without pushing anything.
# Tests: every run first passes every suite on the pushed commit (Vitest, the bot's node tests and
#   its plan copy, the frontend build in the Docker layout, pytest); a red suite stops the release.
#   A check-only commit is therefore also a dry run of the release gate. Run by hand
#   (workflow_dispatch), the workflow runs the tests alone and releases nothing.
on:
  push:
    branches: [claude/relaxed-hypatia-1tpmq5]
    paths: [deploy/hf-release.md, deploy/hf-check.md]
  workflow_dispatch:

concurrency:
  group: hf-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SPACE: ludosiel/StudyForge
  SPACE_HOST: ludosiel-studyforge.hf.space

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # The bot's tests strip types natively (node --experimental-strip-types needs Node 22.6+).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Vitest
        working-directory: frontend
        run: ./node_modules/.bin/vitest run

      - name: Bot tests and its copy of the plan
        run: |
          set -euo pipefail
          node --experimental-strip-types --test supabase/functions/_shared/bot/*.test.ts
          node scripts/sync_bot_plan.mjs --check

      # The image builds the frontend with node:20 from frontend/ and contracts/ only (Dockerfile):
      # the same two folders, the same Node, so a file the build needs from elsewhere fails here.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend build in the Docker layout
        run: |
          set -euo pipefail
          B=$(mktemp -d)
          git archive HEAD frontend contracts | tar -x -C "$B"
          ln -s "$PWD/frontend/node_modules" "$B/frontend/node_modules"
          cd "$B/frontend"
          ./node_modules/.bin/tsc -b
          ./node_modules/.bin/vite build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: pytest
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install -q -r requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0
          python -m pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the token secret
        run: test -n "$HF_TOKEN" || { echo "::error::Repository secret HF_TOKEN is not set"; exit 1; }

      - name: Release or check only
        id: mode
        run: |
          set -uo pipefail
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || git diff --name-only "$BEFORE" "$GITHUB_SHA" -- deploy/hf-release.md | grep -q .; then
            echo "release=1" >> "$GITHUB_OUTPUT"; echo "Mode: release"
          else
            echo "release=0" >> "$GITHUB_OUTPUT"; echo "Mode: check only"
          fi
          git remote add hf "https://user:${HF_TOKEN}@huggingface.co/spaces/${SPACE}"

      - name: Build the release commit on top of the live Space
        if: steps.mode.outputs.release == '1'
        run: |
          set -euo pipefail
          git config user.name "Meldy release"
          git config user.email "release@users.noreply.github.com"
          # The HF git server breaks the "have" negotiation of a fetch from this repo: protocol v2
          # fails with "expected 'acknowledgments'", v1 with "the remote end hung up" (2026-10-04,
          # git 2.43 and 2.55 alike). The noop negotiation sends no "have" lines and takes the
          # Space's whole history, which works with both protocols.
          git -c fetch.negotiationAlgorithm=noop fetch --no-tags hf main \
            || git -c protocol.version=1 -c fetch.negotiationAlgorithm=noop fetch --no-tags hf main \
            || git -c protocol.version=1 fetch --no-tags hf main
          LIVE=$(git rev-parse FETCH_HEAD)
          git rm -r -q --cached --ignore-unmatch qa-screens deck
          TREE=$(git write-tree)
          REL=$(git commit-tree "$TREE" -p "$LIVE" -m "Release ${GITHUB_SHA::7} from ${GITHUB_REPOSITORY}@${GITHUB_REF_NAME}")
          echo "LIVE=$LIVE" >> "$GITHUB_ENV"
          echo "REL=$REL" >> "$GITHUB_ENV"
          echo "Live Space main: $LIVE"
          echo "Release commit:  $REL (tree of ${GITHUB_SHA})"

      - name: Tag the live version and push the release
        if: steps.mode.outputs.release == '1'
        run: |
          set -euo pipefail
          TAG="hf-backup-$(date -u +%Y-%m-%d-%H%M)-pre-push"
          git tag -a "$TAG" "$LIVE" -m "Live Space main before release of ${GITHUB_SHA::7}"
          git push hf "refs/tags/$TAG"
          git push hf "$REL:refs/heads/main"
          echo "Backup tag: $TAG -> $LIVE"

      - name: Expected commit on the Space
        run: |
          set -euo pipefail
          EXPECT="${REL:-}"
          if [ -z "$EXPECT" ]; then EXPECT=$(git ls-remote hf refs/heads/main | cut -f1); fi
          echo "EXPECT=$EXPECT" >> "$GITHUB_ENV"
          echo "Expecting the Space to run $EXPECT"

      - name: Wait until the Space runs it
        run: |
          set -u
          STAGE=""; SHA=""
          for i in $(seq 1 100); do
            J=$(curl -sSL -H "Authorization: Bearer $HF_TOKEN" "https://huggingface.co/api/spaces/${SPACE}" 2>/dev/null || true)
            STAGE=$(printf '%s' "$J" | jq -r '.runtime.stage // empty' 2>/dev/null || true)
            SHA=$(printf '%s' "$J" | jq -r '.runtime.sha // .sha // empty' 2>/dev/null || true)
            if [ -z "$STAGE" ]; then echo "[$i] unexpected API answer: $(printf '%s' "$J" | head -c 200)"; fi
            echo "[$i] stage=$STAGE sha=$SHA"
            if [ "$SHA" = "$EXPECT" ] && [ "$STAGE" = "RUNNING" ]; then exit 0; fi
            if [ "$SHA" = "$EXPECT" ]; then
              case "$STAGE" in BUILD_ERROR|RUNTIME_ERROR|CONFIG_ERROR) echo "::error::Space stage $STAGE"; exit 1;; esac
            fi
            sleep 20
          done
          echo "::error::Space did not reach RUNNING on $EXPECT (last stage=$STAGE sha=$SHA)"; exit 1

      # RUNNING comes a moment before uvicorn answers: /api/health may say 502 for the first seconds
      # (runs 37829212148, 38101865091), so the check waits up to two minutes for a 200.
      - name: Smoke check
        run: |
          set -uo pipefail
          for i in $(seq 1 12); do
            if curl -fsSL -o /tmp/health.json "https://${SPACE_HOST}/api/health"; then
              jq . /tmp/health.json
              curl -fsSL -o /dev/null -w "root: %{http_code}\n" "https://${SPACE_HOST}/" && exit 0
            fi
            echo "[$i] not answering yet"; sleep 10
          done
          echo "::error::The Space did not answer /api/health and / with 200 within two minutes"; exit 1
