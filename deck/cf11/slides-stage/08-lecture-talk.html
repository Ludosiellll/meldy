<template data-pptx="notes">По этим материалам лекцию учат. Карточка это вопрос и ответ из лекции. В самопроверке студент отвечает на вопрос и сразу видит пояснение. А подкаст можно слушать по дороге: двое ведущих, Макс и Софья, обсуждают лекцию в двенадцати репликах. У карточек и вопросов тоже видно, из какого места лекции они взяты.

О записи: живой сайт, октябрь 2026 года, та же лекция, что на прошлом слайде. Звука в ролике нет.

Если спросят про разговор о лекции: лекцию можно ещё проговорить вслух. Meldy задаёт четыре вопроса по карточкам этой лекции и переспрашивает, если ответ ушёл в сторону. Ответить можно и текстом.</template>
