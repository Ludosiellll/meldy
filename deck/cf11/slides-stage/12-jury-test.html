<template data-pptx="notes">Четвёртая часть это контрольные. Тест можно пройти по ссылке без аккаунта. А можно сыграть в него всей группой прямо на паре. Слева проектор в классе, справа телефон одной студентки. Класс заходит с телефонов по QR-коду. Ответы лежат на полу, и каждый бежит к своему. Когда время выходит, пол под неверными ответами проваливается. Каждый второй раунд за классом гонится тот самый Дедлайн. В конце трое лучших поднимаются на пьедестал, а у каждого на телефоне остаётся разбор ошибок.

Если спросят: преподаватель нажимает «Провести игру» и выбирает «Встань на ответ». На проекторе появляется PIN. Студенты входят с телефона или кнопкой «Играть» в беседе группы в Telegram. Время считает сервер, верный ответ на телефон приходит только после вопроса.

О записи: настоящая игра 13 ноября 2026 года на нынешней версии. Сервер игры запущен у нас на компьютере, вместо студентов 28 ботов. Проектор и телефон показывают одну и ту же игру в одно и то же время. Вырезано только ожидание, ничего не ускорено.</template>
