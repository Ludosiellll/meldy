<template data-pptx="notes">Третья часть для преподавателя, это конструктор тестов. Преподаватель называет тест и попадает в конструктор. Слева блоки, посередине страница теста, справа настройки. Картинку можно просто перетащить с компьютера. Вопрос добавляется одним нажатием: здесь это вопрос «верно или неверно», преподаватель пишет утверждение и отмечает верный ответ. Оформление выбирают из готовых тем. Перед отправкой тест можно открыть так, как его увидит ученик. Потом преподаватель нажимает «Отправить по ссылке» и получает ссылку и QR-код. Ученикам аккаунт не нужен.

О записи: сегодняшняя версия приложения, запущена на нашем компьютере. Всё, что видно, преподаватель делает сам, нейросеть в конструкторе не участвует.

Если спросят: в конструкторе 8 видов блоков. Это обложка, заголовок, текст, картинка, видео, заметка, разделитель и новая страница. Типов вопросов 4. Один ответ, несколько ответов, верно или неверно, короткий ответ. Тестовые вопросы проверяются без ИИ. Видео можно вставить с YouTube, RuTube и VK Видео. Готовый тест можно вставить текстом из Word или из чата.

Если спросят про вопросы в ролике: это пустые заготовки, их текст пишут в настройках блока.</template>
