<template data-pptx="notes">Третья часть для преподавателя, это конструктор тестов. Преподаватель называет тест и собирает страницу из блоков. Картинку можно перетащить с компьютера, видео вставить ссылкой. Вопросы добавляются одним нажатием, у каждого свои баллы. Оформление выбирают из готовых тем. Перед отправкой тест можно открыть так, как его увидит ученик. Ученики получают ссылку или QR-код, аккаунт им не нужен.

О записи: живой сайт, октябрь 2026 года. Запись идёт в настоящем темпе.

Если спросят: в конструкторе 8 видов блоков. Это обложка, заголовок, текст, картинка, видео, заметка, разделитель и новая страница. Типов вопросов 4. Один ответ, несколько ответов, верно или неверно, короткий ответ. Тестовые вопросы проверяются без ИИ. Видео можно вставить с YouTube, RuTube и VK Видео. Готовый тест можно вставить текстом из Word или из чата.

Если спросят про вопросы в ролике: это пустые заготовки, их текст пишут в настройках блока.</template>
