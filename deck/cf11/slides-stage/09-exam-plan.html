<template data-pptx="notes">Теперь экзамены. Преподаватель выдаёт список вопросов, и студент загружает этот файл в Meldy.

Meldy находит в нём двести сорок вопросов. Правильные ответы он берёт из самого файла: там они выделены жирным. Ключи нейросеть не придумывает.

Студент ставит дату экзамена и время, которое готов учить в день. И Meldy сразу считает: чтобы пройти все вопросы к четвёртому декабря, хватит примерно двадцати пяти минут в день.

После сохранения видно задание на сегодня.

А план по дням показывает весь путь до экзамена. Если день пропущен, его вопросы сами переходят на следующие.

О записи: сегодняшняя версия приложения, запущена на нашем компьютере. Файл с вопросами настоящий: 240 вопросов по C# в 12 темах. Все числа на странице экзамена и в плане считает само приложение.</template>
