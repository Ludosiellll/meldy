<template data-pptx="notes">Теперь ответ вслух. Студент получает вопрос билета и отвечает на него голосом. Meldy записывает его слова текстом и сразу отмечает, какие ключевые пункты уже прозвучали. Потом сверяет ответ с лекциями самого студента. Здесь студент назвал один пункт не до конца, и Meldy переспросил, как экзаменатор. В конце видно, что сказано и что пропущено. К каждому пункту есть цитата из лекции: сверху слова студента, под ними место из лекции.

О записи: сегодняшняя версия приложения на телефоне, запущена на нашем компьютере. Распознавание речи и проверка ответа в ней сохранены заранее: это ответ живого сайта от 21 октября. Слева те же слова крупно, они переписаны с экрана без изменений.

Если спросят, насколько точна проверка: мы взяли 11 ответов, оценка которых известна заранее. В них 42 пункта. Meldy верно оценил 41. Одна ошибка такая. Пункт засчитан, хотя в нём была фактическая ошибка.</template>
