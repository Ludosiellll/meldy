<template data-pptx="notes">Теперь ответ вслух. Студент получает вопрос билета…

…и отвечает голосом, как на экзамене. Meldy записывает его слова текстом и по ходу отмечает, какие главные пункты уже прозвучали.

Потом Meldy сверяет ответ с лекциями самого студента.

Здесь студент сказал, что аномалии бывают, но не назвал какие. И Meldy переспросил, как сделал бы экзаменатор.

В конце видно, что сказано и что пропущено: два главных пункта из трёх студент назвал сам.

И к каждому пункту есть цитата из лекции. Её не пишет нейросеть: код вырезает её из лекции слово в слово. Сверху слова студента, под ними место из лекции, общие слова подчёркнуты.

О записи: сегодняшняя версия приложения на телефоне, запущена на нашем компьютере. Распознавание речи и проверка ответа в ней сохранены заранее: это ответ живого сайта от 21 октября. Слева те же слова крупно, они переписаны с экрана без изменений.

Если спросят, насколько точна проверка: мы взяли 11 ответов, оценка которых известна заранее. В них 42 пункта. Meldy верно оценил 41. Одна ошибка такая. Пункт засчитан, хотя в нём была фактическая ошибка.</template>
