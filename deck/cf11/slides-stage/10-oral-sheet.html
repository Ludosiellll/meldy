<template data-pptx="notes">Теперь ответ вслух. Студент отвечает на вопрос голосом, а Meldy записывает его слова текстом. Ответ проверяется по лекциям самого студента. Здесь студент назвал один пункт не до конца, и Meldy переспросил, как экзаменатор. В конце видно, что сказано и что пропущено. К каждому пункту есть цитата из лекции: сверху слова студента, под ними место из лекции.

О записи: живой сайт, 21 октября 2026 года. Голос синтезирован и подан в микрофон браузера, звука в ролике нет. Телефон справа это сама запись. Слева те же слова крупно, они переписаны с экрана без изменений. Запись идёт в настоящем темпе. Там, где слева нужно время на чтение, кадр стоит.

Если спросят, насколько точна проверка: мы взяли 11 ответов, оценка которых известна заранее. В них 42 пункта. Meldy верно оценил 41. Одна ошибка такая. Пункт засчитан, хотя в нём была фактическая ошибка.</template>
