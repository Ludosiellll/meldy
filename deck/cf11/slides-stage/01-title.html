<template data-pptx="notes">Здравствуйте. Наш проект называется Meldy. В нём четыре части: лекции, экзамены, конструктор тестов и контрольные. Из лекции Meldy делает конспект, карточки, самопроверку и подкаст. По вопросам кафедры составляет план до экзамена и проверяет ответы вслух. В конструкторе преподаватель собирает свой тест, а потом даёт его группе как контрольную: по ссылке или игрой на паре. Справа ответ вслух: Meldy слушает студента и переспрашивает о том, что он пропустил.
