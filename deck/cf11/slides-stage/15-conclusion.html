<template data-pptx="notes">Кому мы рекомендуем Meldy. Студентам на весь семестр, чтобы из каждой лекции получать конспект, карточки, самопроверку и подкаст. Перед сессией Meldy составляет план по вопросам кафедры и проверяет ответы вслух. Преподавателям мы рекомендуем конструктор, контрольные по одной ссылке и игру на паре. Теперь про деньги. Пользоваться можно бесплатно, с дневным лимитом: это примерно пять лекций или двадцать пять ответов вслух в день. PRO стоит пять долларов в месяц, лимит в нём в десять раз больше. Школе, колледжу или вузу мы предлагаем лицензию, один доллар за ученика в месяц. Продвижение идёт снизу вверх: группа приходит по одной ссылке, а тест преподавателя открывают без аккаунта и так узнают о Meldy. Попробовать можно прямо сейчас по QR-коду, без регистрации. Выучил, и точка. Спасибо.

Если спросят про лимит: бесплатно это примерно пять лекций или двадцать пять ответов вслух в день. В PRO в десять раз больше.

Если спросят про продвижение и масштаб: группа приходит по одной ссылке. Тест преподавателя открывают без аккаунта и так узнают о Meldy. Тестовые вопросы проверяются без ИИ, поэтому участники теста не тратят лимит. Одну контрольную без аккаунта могут пройти до 2000 раз. Учебное заведение раздаёт экзамен группе одной ссылкой, а преподаватель видит отчёт.

Если спросят: бесплатно 100 единиц в день, в PRO 1000. Одна лекция стоит 20 единиц. Проверка ответа вслух стоит 4 единицы. Это из backend/plans.py.</template>
