<template data-pptx="notes">Начнём с лекций. Студент загружает лекцию файлом, текстом, ссылкой или записью с пары. Потом отмечает, что из неё сделать: конспект, карточки, самопроверку, выжимку и подкаст. Meldy читает лекцию и готовит всё сразу. Первым открывается конспект с главными тезисами. Под каждым разделом стоит ссылка на фрагмент лекции, из которого он взят. Так студент может проверить Meldy по своему же материалу.

О записи: живой сайт, октябрь 2026 года. Запись идёт в настоящем темпе, вырезано только ожидание. Самопроверка в записи ещё называется «Тест», это её прежнее название.

Если спросят, как быстро: с 5 по 12 октября 38 раз из 39 материалы были готовы меньше чем за 30 секунд. Это данные журнала сайта.</template>
