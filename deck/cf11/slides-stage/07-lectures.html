<template data-pptx="notes">Начнём с лекций. Студент открывает «Разобрать лекцию» и загружает её файлом, текстом, ссылкой или записью с пары. Здесь это видеозапись лекции по экономике. Потом отмечает, что из неё сделать: конспект, карточки, самопроверку, выжимку и подкаст. Meldy читает лекцию и готовит всё сразу, а по полосе бежит наша Точка. Первым открывается конспект с главными тезисами. Под каждым разделом стоит ссылка на фрагмент лекции. Нажимаем на неё и видим то место лекции, из которого этот раздел взят. Так студент может проверить Meldy по своему же материалу.

О записи: сегодняшняя версия приложения, запущена на нашем компьютере без интернета. Ответы нейросети в ней сохранены заранее: это то, что Meldy сделал из этой лекции на сайте.

Если спросят, как быстро: с 5 по 12 октября 38 раз из 39 материалы были готовы меньше чем за 30 секунд. Это данные журнала сайта.</template>
