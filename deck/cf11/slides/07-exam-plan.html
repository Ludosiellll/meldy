<template data-pptx="notes">Как это выглядит. Студент перетаскивает файл с вопросами. Meldy находит вопросы и, если у них есть варианты, берёт ключ прямо из файла — по жирному шрифту или пометке.

Студент указывает дату экзамена и сколько минут в день готов заниматься. Дальше Meldy сам считает, сколько новых вопросов и сколько повторений на сегодня, и пересчитывает план, если день пропущен.</template>
