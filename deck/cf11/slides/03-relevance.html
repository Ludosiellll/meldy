<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>03 · Актуальность — Meldy · CodingFest-11</title>
<link rel="stylesheet" href="../design/deck.css">
<link rel="stylesheet" href="../design/stage.css">
<style>
/* What a student has before the session, drawn without a number: two rows of lecture sheets and a field of question
   squares. The motion is native builds: every sheet is its own picture and arrives one after another, column by
   column, like the weeks of a semester; then the questions fill the field row by row from the bottom up (one picture
   per row of 40). Calm fades only; the static frame (PDF, Normal view) is the full field. No count is tied to it. */
.sheet { position: absolute; width: 44px; height: 56px; border-radius: 8px; background: var(--surface-soft); border: 2px solid var(--line); }
.sheet i { position: absolute; left: 8px; height: 4px; border-radius: 2px; background: #3a4456; }
.qrow { position: absolute; width: 800px; height: 14px; }
.q { position: absolute; top: 0; width: 14px; height: 14px; border-radius: 3px; background: #2b3444; }
</style>
</head>
<body>
<main class="slide dark">

<div class="sec" data-pptx="title">Актуальность</div>
<div class="mark" data-pptx="text" data-name="!!word" style="left:1682px">Meldy</div>
<div class="mark-dot" data-pptx="shape" data-name="!!dot" style="left:1780px;top:76px"></div>

<div class="claim" data-pptx="text" data-anim="rise" data-anim-dur="700" data-anim-order="1">Перед сессией у&nbsp;студента десятки лекций<br>и&nbsp;сотни вопросов кафедры</div>

<div class="t28" data-pptx="text" style="left:964px;top:372px" data-anim="fade" data-anim-trigger="after" data-anim-dur="400" data-anim-order="2">Лекции за&nbsp;семестр</div>
<div id="sheets"></div>
<div class="t28" data-pptx="text" style="left:964px;top:596px" data-anim="fade" data-anim-trigger="after" data-anim-dur="400" data-anim-order="3">Вопросы кафедры</div>
<div id="grid"></div>

<div class="t48" data-pptx="text" style="left:128px;top:420px" data-anim="rise" data-anim-trigger="after" data-anim-dur="600" data-anim-order="4">Сколько учить в&nbsp;день<br>и&nbsp;что уже выучено,<br>студент считает сам</div>
<div class="t48" data-pptx="text" style="left:128px;top:680px;color:var(--muted)" data-anim="rise" data-anim-trigger="after" data-anim-dur="600" data-anim-order="5">Проверить себя он может<br>только на&nbsp;экзамене</div>
<script>
  // Lecture sheets: 2 rows of 14 (44 x 56, step 58 x 72) from (964, 420), three text lines each. One picture per
  // sheet; they arrive column by column (top, then bottom), 45 ms apart, each a 300 ms fade.
  const main = document.querySelector('main.slide');
  const sheetsAt = document.getElementById('sheets');
  for (let k = 0; k < 28; k++) {
    const col = Math.floor(k / 2), row = k % 2;
    const d = document.createElement('div');
    d.className = 'sheet';
    d.style.left = (964 + col * 58) + 'px';
    d.style.top = (420 + row * 72) + 'px';
    d.innerHTML = '<i style="top:12px;width:26px"></i><i style="top:22px;width:22px"></i><i style="top:32px;width:18px"></i>';
    Object.assign(d.dataset, { pptx: 'image', anim: 'fade', animTrigger: 'with', animDelay: String(k * 45), animDur: '300', animOrder: '2' });
    d.setAttribute('aria-label', 'Лекция');
    main.insertBefore(d, sheetsAt);
  }
  sheetsAt.remove();
  // Questions: a field of 40 x 16 squares (14 px, step 20) from (964, 644). One picture per row; the rows fill the
  // field from the bottom up, 75 ms apart, each a 300 ms fade.
  const gridAt = document.getElementById('grid');
  const ROWS = 16;
  for (let r = 0; r < ROWS; r++) {
    const row = document.createElement('div');
    row.className = 'qrow';
    row.style.left = '964px';
    row.style.top = (644 + r * 20) + 'px';
    for (let i = 0; i < 40; i++) {
      const q = document.createElement('div');
      q.className = 'q';
      q.style.left = (i * 20) + 'px';
      row.appendChild(q);
    }
    Object.assign(row.dataset, { pptx: 'image', anim: 'fade', animTrigger: 'with', animDelay: String((ROWS - 1 - r) * 75), animDur: '300', animOrder: '3' });
    row.setAttribute('aria-label', 'Вопросы кафедры');
    main.insertBefore(row, gridAt);
  }
  gridAt.remove();
</script>

<template data-pptx="notes">Перед сессией у студента десятки лекций и сотни вопросов кафедры. Сколько учить в день и что уже выучено, студент считает сам. А проверить себя он может только на самом экзамене.</template>
</main>
</body>
</html>
