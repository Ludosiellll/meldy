<template data-pptx="notes">Перед экзаменом нужно выучить сотни вопросов, и сколько учить в день, каждый считает сам. Вот один вопрос экзамена по C#, а всего в экзамене их 240. Так у каждого в классе или группе, это около 25 человек. По всей стране это около полутора миллионов школьников и студентов. Meldy для всех, кто готовится к экзамену: для школьников, учащихся колледжей и студентов.

Если спросят: школьников 1 058 693 на начало 2025/2026 учебного года (Министерство образования, по данным СМИ: Наша Нива, Myfin). Учащихся колледжей 116,6 тысячи в ССО и 67,5 тысячи в ПТО (Министерство образования, августовская презентация 2025 года). Студентов вузов 229 тысяч (Белстат, «Образование в Республике Беларусь в 2025 году»). Всего около 1,47 миллиона, на слайде округлено до 1,5 миллиона. 25 человек — типичный класс или группа. Точка на карте — один класс или группа, точек 58 872, это 1,47 миллиона, делённые на 25. 240 — столько вопросов в нашем примере экзамена по C#, вопрос в кадре — номер 103 этого экзамена.</template>
