<template data-pptx="notes">Шпаргалка показывает, что осталось выучить. У каждого вопроса есть строки — главные пункты ответа.

Назвал пункт — строка бледнеет. Назвал снова в другой день — строка стирается. Забыл — она возвращается. Так видно не сколько прочитано, а сколько осталось. Цель, с которой мы начали, — ноль строк к утру экзамена.

О записи: это пример экзамена на сайте, вчерашний ответ в нём задан заранее. Сегодняшний ответ называет те же пункты снова — три строки стираются, счётчик идёт с 47 до 44.</template>
