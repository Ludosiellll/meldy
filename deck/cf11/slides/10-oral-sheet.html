<template data-pptx="notes">Теперь ответ вслух. На устный вопрос студент отвечает голосом. Meldy записывает сказанное текстом и проверяет ответ по лекциям самого студента. Если пункт назван не полностью, Meldy переспрашивает, как экзаменатор. В кадре как раз этот момент. В конце студент видит итог. Что он сказал и что пропустил. К каждому пункту есть цитата из лекции.

О записи: живой сайт, 21 октября 2026 года. Голос в ролике синтезирован и подан в микрофон браузера. Звука в ролике нет. Вырезаны только отрезки, где на экране ничего не меняется. Ничего не ускорено.

Если спросят, насколько точна проверка: мы взяли 11 ответов, оценка которых известна заранее. В них 42 пункта. Meldy верно оценил 41. Одна ошибка такая. Пункт засчитан, хотя в нём была фактическая ошибка.</template>
