<template data-pptx="notes">Устный вопрос: студент отвечает голосом, Meldy записывает сказанное текстом и сверяет с его же лекциями. Если пункт назван не полностью, Meldy переспрашивает, как экзаменатор. Потом протокол: какие пункты названы, каких нет, и к каждому цитата из лекции.

Справа шпаргалка. У каждого вопроса есть строки, главные пункты ответа. Назвал пункт — строка желтеет. Назвал снова в другой день — строка стирается. Забыл — она возвращается. В ролике после ответа три строки стёрлись, счётчик пошёл с 47 до 44.

Насколько проверка точна: на 11 ответах с известной правдой 41 оценка по пунктам из 42 совпала с правильной; одна ошибка — пункт засчитан, хотя в нём была фактическая ошибка.

О записи: живой сайт, 11 октября 2026 года. Голос в ролике телефона синтезирован и подан в микрофон браузера, звука нет; вырезано только ожидание, ничего не ускорено. Шпаргалка — открытый пример /try, вчерашний ответ в нём задан заранее.</template>
