<template data-pptx="notes">Теперь экзамен. Студент загружает файл с вопросами кафедры. Meldy находит вопросы и, если у них есть варианты, берёт ключ прямо из файла — по жирному шрифту или пометке.

Студент указывает дату экзамена и сколько минут в день готов заниматься. Дальше Meldy сам считает, сколько новых вопросов и сколько повторений на сегодня, и пересчитывает план, если день пропущен.

О записи: это живой сайт. Ролик начинается с готового плана, потом показывает, как экзамен сделан. Окно выбора файла и сохранение вырезаны мягким переходом, ничего не ускорено.</template>
