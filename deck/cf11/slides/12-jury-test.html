<template data-pptx="notes">Четвёртая часть это контрольные. Пройти тест можно двумя способами. Первый по ссылке. Наведите камеру на код справа. Откроется настоящий тест «Эластичность спроса за минуту». Входить не нужно. Пять вопросов, около минуты. После «Завершить» вы сразу увидите балл, ошибки и пояснения. А автор увидит вашу попытку на своей странице.

Второй способ это игра на паре. Она называется «Встань на ответ». Слева проектор в классе, справа телефон одной студентки. Вопрос на проекторе и на каждом телефоне. Ответы лежат на полу, у каждого свой цвет. Каждый ведёт своего героя пальцем и встаёт на ответ, который считает верным. Время вышло, и пол под неверными ответами проваливается. Кто упал, играет дальше призраком. Верный ответ вернёт его в игру.

Если спросят: преподаватель нажимает «Провести игру» и выбирает «Встань на ответ». На проекторе появляется PIN. Студенты входят с телефона или кнопкой «Играть» в беседе группы в Telegram. На вопрос 15, 20 или 30 секунд. Верный ответ даёт от 500 до 1000 очков. Кто встал раньше, получает больше. За серию верных ответов подряд до 1400. Призрак на верном ответе получает половину. Вопросы проверяются без ИИ, поэтому игра не тратит лимит. Тест открыт всем по ссылке без аккаунта. Время не ограничено, попыток сколько угодно.

О записи: настоящая игра 21 октября 2026 года. Сервер игры запущен у нас на компьютере, вместо студентов 30 ботов. Проектор и телефон показывают одну и ту же игру в одно и то же время. Каждый кадр нарисован настоящей страницей проектора и настоящей страницей телефона по записи этой игры. Телефон Лизы, она встала на «Венеру» и упала. Вырезано только ожидание, когда все уже стоят на ответах. Ничего не ускорено.
