<template data-pptx="notes">Начнём с лекций — с ними студент работает весь семестр. Лекцию загружают файлом или фото, текстом, ссылкой на страницу или записью до 15 мегабайт.

Дальше студент выбирает, что сделать. По умолчанию отмечены конспект, карточки для повторения по дням и тест с объяснением ошибок; можно добавить выжимку на одну страницу и подкаст, где два ведущих обсуждают лекцию.

Из этих же лекций Meldy берёт пункты ответа и цитаты, когда проверяет ответ вслух.

О записи: [сверить с роликом, когда он будет готов] это живой сайт. Лекция в ролике — наша: текст «Рыночное равновесие», голос синтезирован; в ролике отмечены все пять материалов. Ожидание, пока Meldy готовит материалы, вырезано мягким переходом, ничего не ускорено.

Если спросят: запись — файлом MP4, MP3, WAV, MPEG или M4A до 15 МБ. Это примерно 15–30 минут звука, видео той же длины весит больше; запись целой пары обычно больше лимита — её делят на части. Файл — PDF, DOCX, PPTX, HTML, TXT, MD, JPG или PNG. Ссылку на YouTube Meldy не открывает; со страницы по ссылке берёт основной текст без меню и рекламы. Сканы и фото страниц распознаёт Google Gemini, на телефоне конспект можно сфотографировать.</template>
