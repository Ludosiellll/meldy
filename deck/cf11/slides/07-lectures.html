<template data-pptx="notes">Начнём с лекций. С ними студент работает весь семестр. Лекцию загружают файлом или фото, текстом, ссылкой на страницу или записью до 15 мегабайт. Студент выбирает, что получить. Конспект, карточки для повторения по дням, самопроверку с объяснением ошибок. А ещё выжимку на одну страницу и подкаст, где два ведущих обсуждают лекцию.

У каждого раздела конспекта стоят фрагменты лекции, из которых он взят. По ним раздел легко проверить. Если текст распознан из записи, Meldy так и пишет: сверьте термины, числа и имена.

О кадре: живой сайт, 22 октября 2026 года. Это наша лекция «Рыночное равновесие, спрос и предложение». Мы загрузили её видеофайлом. Пример без регистрации: ludosiel-studyforge.hf.space/try/lecture.

Если спросят, как быстро: с 5 по 12 октября 38 раз из 39 материалы были готовы меньше чем за 30 секунд. Это данные журнала сайта.</template>
