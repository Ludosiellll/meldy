<template data-pptx="notes">Начнём с лекций — с ними студент работает весь семестр. Лекцию загружают файлом или фото, текстом, ссылкой на страницу или записью до 15 мегабайт.

Дальше студент выбирает, что сделать. По умолчанию отмечены конспект, карточки для повторения по дням и тест с объяснением ошибок; можно добавить выжимку на одну страницу и подкаст, где два ведущих обсуждают лекцию. В ролике отмечены все пять, и трёхминутное видео Meldy разобрал за 22 секунды.

Из этих же лекций Meldy берёт пункты ответа и цитаты, когда проверяет ответ вслух.

О записи: это живой сайт и тестовый аккаунт; лекция наша — текст и слайды сделаны нами, голос синтезирован, видео (3 минуты, 2 МБ) загружено как обычный файл. Ожидание вырезано мягкими переходами — в этой записи анализ занял 22 секунды от нажатия до всех пяти материалов, — как и ответы на остальные вопросы теста и загрузка звука подкаста; ничего не ускорено, звука в ролике нет. Всё остальное — настоящий интерфейс сайта.

Если спросят: время мерили только на коротких лекциях — то же трёхминутное видео в другой раз разбиралось 34 секунды. Запись — файлом MP4, MP3, WAV, MPEG или M4A до 15 МБ. Это примерно 15–30 минут звука, видео той же длины весит больше; запись целой пары обычно больше лимита — её делят на части. Файл — PDF, DOCX, PPTX, HTML, TXT, MD, JPG или PNG. Ссылку на YouTube Meldy не открывает; со страницы по ссылке берёт основной текст без меню и рекламы. Сканы и фото страниц распознаёт Google Gemini, на телефоне конспект можно сфотографировать.</template>
