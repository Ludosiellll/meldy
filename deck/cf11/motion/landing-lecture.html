<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>landing-lecture — «Лекция → конспект, карточки, самопроверка» on the landing page</title>
<link rel="stylesheet" href="clip.css">
<link rel="stylesheet" href="landing-film.css">
</head>
<body>
<div class="stage" id="stage"></div>
<script src="clip.js"></script>
<script src="../media/gen/footage/lecture-take/take.js"></script>
<script src="landing-film.js"></script>
<script>
/* The landing's lecture tile (owner 19.11: the clips there were «резко и ничего не понятно»). Four steps of the take
   the deck's slide 07 is cut from (lecture-take: today's app, the lecture «Рыночное равновесие»): the file is chosen;
   the five materials get ready one by one; the summary with its key points; a section and the lecture's fragment it is
   taken from. Every step runs in real time; the waits between them are left out with a dissolve.
   Rendered: node deck/cf11/motion/render.mjs landing-lecture --fps 25 --blur 3 --jobs 1 --crf 20, then encoded for the
   page and cut into parts (frontend/scripts/footage-parts.mjs). */
const STAGE = [1280, 800], WIN = [32, 28, 1216, 640];
const { box, mark, cuts } = landingFilmTools(WIN);
const { pieces, end, F } = cuts([
  [mark('pick') + 0.3, mark('file-chosen') + 2.0],          // 1: the lecture's file is chosen
  [mark('progress') + 0.7, mark('done-5') + 0.5, 0.45],     // 2: the five materials get ready
  [mark('results') + 0.3, mark('results') + 4.0, 0.45],     // 3: the summary
  [mark('chip') - 0.6, mark('fragment-open') + 2.7, 0.45],  // 4: a section and its fragment of the lecture
]);
const T = end + 0.7;
landingFilm({
  footage: '../media/gen/footage/lecture-take/', stage: STAGE, win: WIN, T, seam: 0.55, pieces,
  cam0: box(296, 250, 880),
  moves: [
    { at: F(0, mark('file-chosen')) + 0.2, dur: 1.7, box: box(320, 288, 836) },         // the chosen file: a slow push
    { at: pieces[1].f0, cut: true, box: box(520, 150, 800) },                            // the progress card: its title, the track
    { at: F(1, mark('done-2')) - 0.2, dur: 2.2, box: box(520, 300, 800) },               // down to the five rows
    { at: pieces[2].f0, cut: true, box: box(420, 200, 1000) },                           // the result's title and tabs
    { at: F(2, mark('results')) + 1.5, dur: 1.4, box: box(424, 338, 740) },              // the key points, under the title
    { at: pieces[3].f0, cut: true, box: box(470, 96, 900) },                             // a section with its fragment chip
    { at: F(3, mark('fragment-open')) - 0.5, dur: 1.3, box: box(0, 100, 1000) },         // the lecture's own words open beside it
  ],
  steps: [
    { from: -1, to: pieces[1].f0 + 0.05, text: 'Загружаете лекцию: файл, текст или ссылка' },   // there from the first frame (the poster)
    { from: pieces[1].f0 + 0.3, to: pieces[2].f0 + 0.05, text: 'Meldy готовит из неё пять материалов' },
    { from: pieces[2].f0 + 0.3, to: pieces[3].f0 + 0.05, text: 'Сначала конспект: главное из лекции' },
    { from: pieces[3].f0 + 0.3, to: T, text: 'У раздела видно, откуда он взят' },
  ],
});
window.__film = { T, pieces };
</script>
</body>
</html>
