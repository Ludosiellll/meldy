    const yel = ramp(bh, 44, 12);
    if (yel > 0) {
      const w = Math.max(bw, 7), h = Math.max(bh, 7);
      const r = mix(Math.min(w, h) * 0.12, Math.min(w, h) / 2, ramp(bh, 16, 7));
      if (bh < 12) { g.fillStyle = C.panel; rr(g, ox - w / 2 - 2.5, oy - h / 2 - 2.5, w + 5, h + 5, r + 2.5); g.fill(); }
      g.globalAlpha = yel; g.fillStyle = C.yellow;
      rr(g, ox - w / 2, oy - h / 2, w, h, r); g.fill();
      g.globalAlpha = 1;
    }
    // the cell we came from: a thin yellow ring while it is a cell on a phone that is still large
    const cw = TW * s, ch = TH * s, ph = PH * s;
    const cellRing = ramp(cw, 300, 150) * (1 - ramp(ph, 330, 230));
    if (cellRing > 0.001) {
      const cx = X(tileX(FOCAL) + TW / 2), cy = Y(tileY(FOCAL) + TH / 2);
      g.globalAlpha = cellRing; g.lineWidth = 3; g.strokeStyle = C.yellow;
      g.beginPath(); g.arc(cx, cy, Math.max(Math.hypot(cw, ch) / 2 + 7, 11), 0, Math.PI * 2); g.stroke();
      g.globalAlpha = 1;
    }
    // our phone: a yellow edge while it is one of the 25
    const edge = ramp(ph, 430, 300) * (1 - ramp(ph, 26, 13));
    if (edge > 0.001) {
      g.globalAlpha = edge; g.lineWidth = 2.5; g.strokeStyle = C.yellow;
      const m = 4.5;
      rr(g, X(-PW / 2) - m, Y(-PH / 2) - m, PW * s + 2 * m, PH * s + 2 * m, PR * s + m); g.stroke();
      g.globalAlpha = 1;
    }
    // our class: a ring once it is small
    const ringA = ramp(bh, 72, 36);
    if (ringA > 0.001) {
      const rad = Math.max(Math.hypot(bw, bh) / 2 + 8, 15);
      g.globalAlpha = ringA; g.lineWidth = 2.5; g.strokeStyle = C.yellow;
      g.beginPath(); g.arc(ox, oy, rad, 0, Math.PI * 2); g.stroke();
      g.globalAlpha = 1;
    }
    // «ваша группа · Бобруйск» once the map holds
    const lab = clamp((t - MOVES[2][1] - 100) / 500);
    if (lab > 0) {
      const a = lab * lab * (3 - 2 * lab);
      g.font = '500 28px Onest'; g.letterSpacing = '0px';
      const text = 'ваша группа · Бобруйск';
      const tw = g.measureText(text).width;
      const lx = Math.round(ox + 15 + 14), ly = Math.round(oy - 26), lw = Math.round(tw + 44);
      g.globalAlpha = a;
      rr(g, lx, ly, lw, 52, 26); g.fillStyle = C.stage; g.fill();
      rr(g, lx + 0.75, ly + 0.75, lw - 1.5, 50.5, 25.25); g.lineWidth = 1.5; g.strokeStyle = C.outline; g.stroke();
      g.fillStyle = C.label; g.textBaseline = 'middle';
      g.fillText(text, lx + 22, ly + 27);
      g.textBaseline = 'alphabetic';
      g.globalAlpha = 1;
    }
  }

  // the frame: the stage's canvas in the corners, the theme's line along the edge
  function frame() {
    g.beginPath(); g.rect(0, 0, W, H); g.roundRect(1, 1, W - 2, H - 2, 28);
    g.fillStyle = C.stage; g.fill('evenodd');
    rr(g, 1, 1, W - 2, H - 2, 28); g.lineWidth = 2; g.strokeStyle = C.edge; g.stroke();
  }

  let ready = false;
  function seek(t) { if (ready) draw(t); }
  window.__zoom = { T, MOVES, dots: () => MAP.n + 0, pitchKm: () => PITCH_KM, stops: () => STOPS() };
  document.fonts.ready.then(async () => {
    await Promise.all(['400', '500', '600'].map((w) => document.fonts.load(`${w} 28px Onest`)));
    build();
    ready = true;
    window.__clip = { T, seek, width: W, height: H, poster: T, loop: false };
    seek(0);
  });
})();
</script>
</body>
</html>
