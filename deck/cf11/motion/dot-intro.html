<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>dot-intro — титул: точка приходит в «Meldy.» по верхушкам букв</title>
<link rel="stylesheet" href="clip.css">
<style>
/* The title's intro (the owner, 13.11: «в самом начале может стоит сделать то же самое? только чуть другое?»). The
   wordmark's yellow dot arrives: it drops from above onto «M», hops along the tops of the letters (M, M, e, l, d), takes the long jump
   from «d» down to its place at the end of the word, looks at the hall, blinks and shuts its eyes: now it is the
   logo's plain dot. The last slide answers it: there the dot jumps out of «Выучил — и точка» and comes back.

   This clip is NOT a video. In PowerPoint on the owner's machine a video's dark ground comes out lighter than the
   slide's canvas (TV levels shown as they are: #0b0f16 reads 25, 29, 33 against 10, 15, 21 — measured on the owner's
   screen recording of 13.11), so a video over the bare canvas shows as a rectangle. The clip is rendered with a
   transparent ground and saved as a GIF (tools/dot_gif.py): only the dot is drawn, its edge matted on the canvas
   colour, so it lies over the slide with no ground of its own. The wordmark itself stays the slide's live text
   (here it is laid out invisibly, with the slide's own type, only to find the tops of the letters; ?word=1 shows it).

   The clip is the slide's top left corner, 1040 × 480 at (0, 0). It starts with the slide: nothing for 0.9 s while
   the live word rises, the dot's way until 3.6 s, its eyes shut by 5.1 s; from 6.6 s the frame is empty again (by
   then the slide's own dot shape has come in over it), and the GIF's last, empty frame stands for ten minutes, so
   PowerPoint never plays it a second time.
   GIF: tools/.venv/bin/python -I tools/dot_gif.py dot-intro (25 frames a second). */
html, body { background: transparent; }
.stage { width: 1040px; height: 480px; background: transparent; }
.word { left: 112px; top: 176px; font-size: 280px; line-height: 280px; font-weight: 600; letter-spacing: -.055em; white-space: nowrap; color: #f3f3f0; visibility: hidden; }
.stage .word span { position: static; }
.stage .word i { position: static; display: inline-block; width: 0; height: 0; vertical-align: baseline; }
.dot { left: 0; top: 0; width: 78px; height: 78px; margin: -39px 0 0 -39px; transform-origin: 50% 100%; will-change: transform; opacity: 0; }
.dot svg { left: 0; top: 0; width: 78px; height: 78px; overflow: visible; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="word" id="word"><span>M</span><span>e</span><span>l</span><span>d</span><span>y</span><i id="base"></i></div>
  <div class="dot" id="dot"><svg viewBox="0 0 20 20">
    <circle cx="10" cy="10" r="10" fill="#f4c45b"/>
    <g id="eyes"><ellipse id="eL" cx="7.1" cy="8.4" rx="1.5" ry="2.4" fill="#0b121c"/><ellipse id="eR" cx="12.9" cy="8.4" rx="1.5" ry="2.4" fill="#0b121c"/></g>
  </svg></div>
</div>
<script src="clip.js"></script>
<script>
(() => {
  const { clamp, E, seg, mix } = window.M;
  const $ = (id) => document.getElementById(id);
  if (new URLSearchParams(location.search).get('word')) $('word').style.visibility = 'visible';
  const T = 6.64;                      // s: 166 frames at 25 a second
  const R = 39;                        // the dot: 78 px, as the slide's own
  const HOME = { x: 899, y: 370 };     // the slide's dot: left 860, top 331, 78 × 78
  const GONE = 6.6;                    // the frame is empty from here

  // --- where the letters' tops are (the slide's own type, measured here) ----------------------------------------
  let way = null;
  function measure() {
    const st = $('stage').getBoundingClientRect();
    const baseline = $('base').getBoundingClientRect().top - st.top;
    const ctx = document.createElement('canvas').getContext('2d');
    ctx.font = "600 280px 'Onest'";
    const L = {};
    for (const s of $('word').querySelectorAll('span')) {
      const m = ctx.measureText(s.textContent);
      const x0 = s.getBoundingClientRect().left - st.left;
      L[s.textContent] = { left: x0 - m.actualBoundingBoxLeft, right: x0 + m.actualBoundingBoxRight, top: baseline - m.actualBoundingBoxAscent };
    }
    const mid = (g) => (g.left + g.right) / 2;
    // the landings: the dot's centre when it stands on a letter's top (on «d», on its stem)
    const on = (x, g) => ({ x, y: g.top - R });
    const stops = [on(L.M.left + 28, L.M), on(L.M.right - 28, L.M), on(mid(L.e), L.e), on(mid(L.l), L.l), on(L.d.right - 24, L.d), { x: HOME.x, y: HOME.y }];
    way = { stops, L, baseline };
  }

  // --- the dot's way --------------------------------------------------------------------------------------------
  const FALL = [0.9, 1.26];                       // from above the slide onto «M»
  // the hops: [start, end, from stop, to stop, the arc's height over the straight line]
  const HOPS = [[1.33, 1.63, 0, 1, 46], [1.7, 2.04, 1, 2, 64], [2.11, 2.49, 2, 3, 84], [2.56, 2.92, 3, 4, 66], [3.0, 3.6, 4, 5, 120]];
  const LANDED = HOPS[4][1];
  const land = (t, at, k) => { const p = (t - at) / 0.14; return p < 0 || p > 1 ? 0 : k * Math.sin(Math.PI * p); };

  function pose(t) {
    const S = way.stops;
    let x = S[0].x, y = S[0].y, sx = 1, sy = 1;
    if (t < FALL[1]) {
      const p = clamp((t - FALL[0]) / (FALL[1] - FALL[0]));
      y = mix(-R - 30, S[0].y, p * p);                       // it falls faster and faster
      const st = 0.12 * p; sx -= st * 0.6; sy += st;
    }
    const q0 = land(t, FALL[1], 0.26); sx += q0; sy -= q0 * 0.9;
    for (const [a, b, i, j, h] of HOPS) {
      if (t >= a && t < b) {
        const p = (t - a) / (b - a);
        x = mix(S[i].x, S[j].x, p);
        y = mix(S[i].y, S[j].y, p) - 4 * h * p * (1 - p);
        const st = 0.1 * Math.sin(Math.PI * p); sx -= st * 0.6; sy += st;
      } else if (t >= b) { x = S[j].x; y = S[j].y; }
      // a crouch before the hop and a squash after it
      const c = seg(t, a - 0.07, a, E.inOut3) * (1 - seg(t, a, a + 0.06, E.out3));
      sx += 0.12 * c; sy -= 0.14 * c;
      const q = land(t, b, j === 5 ? 0.3 : 0.2); sx += q; sy -= q * 0.9;
    }
    // home: a soft settle
    const s = t - LANDED - 0.14;
    if (s >= 0 && s < 0.7) { const w = 0.07 * Math.exp(-5 * s) * Math.sin(2 * Math.PI * 3 * s); sx += w; sy -= w; }
    return { x, y, sx, sy };
  }

  function eyes(t) {
    let look = seg(t, FALL[1], FALL[1] + 0.12) * (1 - seg(t, LANDED + 0.3, LANDED + 0.55));   // ahead, along the word
    let open = 1;
    const blink = (at) => { const p = (t - at) / 0.15; return p < 0 || p > 1 ? 0 : Math.sin(Math.PI * p); };
    open -= 0.92 * blink(LANDED + 0.75);
    const shut = seg(t, 4.75, 5.1, E.inOut3);                // the eyes close and are gone: the logo's plain dot
    return { look, open: clamp(open * (1 - shut), 0, 1), gone: shut };
  }

  function seek(ms) {
    const t = clamp(ms / 1000, 0, T);
    if (!way) measure();
    const dot = $('dot');
    if (t < FALL[0] || t >= GONE) { dot.style.opacity = '0'; return; }
    dot.style.opacity = '1';
    const p = pose(t);
    // the dot is placed by its centre; its squash is about its foot
    dot.style.transform = `translate3d(${p.x.toFixed(2)}px, ${p.y.toFixed(2)}px, 0) scale(${p.sx.toFixed(4)}, ${p.sy.toFixed(4)})`;
    const e = eyes(t);
    $('eyes').style.opacity = String(1 - e.gone);
    for (const [id, cx] of [['eL', 7.1], ['eR', 12.9]]) {
      $(id).setAttribute('cx', (cx + 1.15 * e.look).toFixed(3));
      $(id).setAttribute('ry', (2.4 * Math.max(0.04, e.open)).toFixed(3));
    }
  }

  window.__clip = { T: T * 1000, seek, width: 1040, height: 480, poster: 0, loop: false, fps: 25 };
  document.fonts.load("600 280px 'Onest'").then(() => { way = null; seek(0); });
})();
</script>
</body>
</html>
