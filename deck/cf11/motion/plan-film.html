<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>plan-film — вопросы кафедры из файла и план по дням</title>
<link rel="stylesheet" href="clip.css">
<link rel="stylesheet" href="screen-film.css">
</head>
<body>
<div class="stage" id="stage"></div>
<script src="clip.js"></script>
<script src="../media/gen/footage/plan-take/take.js"></script>
<script src="take-film.js"></script>
<script>
/* The stage version's slide 09, re-shot on today's app (13.11, the owner: «ролики нужны актуальные»). A take of the
   local copy of today's code (tools/record/local.cjs; the take's script and its mock are kept with the take): the
   department's file «Программирование на C#.docx» — the repository's own bank
   backend/tests/fixtures/banks/synthetic/csharp_table.docx, 240 questions in 12 topics, the right answers in bold — is
   chosen, the page's answer is what today's backend/bank_parse.py gives for it, «Нашли 240 вопросов», the exam's date
   04.12.2026 typed by hand, 45 minutes a day, «Сохранить», the exam's page with today's task, «План по дням». Every
   number on the exam's page and in the plan is the app's own, counted from the 240 saved questions.
   The film opens on the whole screen and then goes to the part the talk is about; it runs in real time and holds on
   the plan. Footage: media/gen/footage/plan-take (take_footage.py; ignored by git).
   Rendered: node deck/cf11/motion/render.mjs plan-film --fps 30 --blur 4 --jobs 4 --crf 18 */
const { fit, whole, mark } = takeFilmTools;
const T = 37.2;
takeFilm({
  footage: '../media/gen/footage/plan-take/', T, seam: 0.5,
  pieces: [{ f0: 0, m0: 0, m1: mark('plan-close') - 0.1 }],
  moves: [
    { at: 1.4, dur: 1.4, box: fit([268, 144, 1572, 594], { pad: 40 }) },      // the upload card
    { at: 5.6, dur: 1.2, box: fit([268, 144, 1144, 344], { pad: 48 }) },      // «Нашли 240 вопросов» and the file's row
    { at: 8.6, dur: 1.4, box: fit([268, 144, 1572, 704], { pad: 40 }) },      // what was found and the form, together
    // the form closer: the camera's left edge stands in the empty part of the file's row (x 900), so no word is cut;
    // while the year is typed the page asks to check it, in the bar under the form: the camera stays above that bar
    { at: 11.6, dur: 1.2, box: [900, 262, 940] },                             // the date
    { at: 17.4, dur: 0.9, box: [900, 200, 940] },                             // the minutes' menu opens upward
    { at: 20.3, dur: 1.2, box: [900, 356, 940] },                             // 45 minutes, the note, «Сохранить»
    { at: 24.9, dur: 1.3, box: whole() },                                     // saved: the exam's page, whole
    { at: 27.4, dur: 1.4, box: fit([268, 76, 1572, 474], { pad: 40 }) },      // the title and today's task
    { at: 30.6, dur: 1.1, box: fit([660, 184, 1180, 544], { pad: 18 }) },     // «План по дням»
  ],
  caps: [
    { from: 0.4, to: 5.4, text: 'Студент загружает файл с вопросами кафедры' },
    { from: 6.1, to: 8.6, text: 'Meldy находит в файле 240 вопросов' },
    { from: 9.2, to: 24.6, text: 'Студент ставит дату экзамена и время в день' },
    { from: 26.2, to: 30.4, text: 'Сразу видно, сколько учить сегодня' },
    { from: 31.2, to: T, text: 'План расписан по дням до экзамена' },
  ],
});
</script>
</body>
</html>
