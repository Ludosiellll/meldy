<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>lecture-film — лекция и что Meldy из неё делает</title>
<link rel="stylesheet" href="clip.css">
<link rel="stylesheet" href="screen-film.css">
</head>
<body>
<div class="stage" id="stage"></div>
<script src="clip.js"></script>
<script src="screen-film.js"></script>
<script>
/* The stage version's slide 07 (13.11). The recording of the live site (account A, October 2026;
   media/product/masters/lecture-master.mp4, 1536 × 1200): «Разобрать лекцию», the four ways in, the lecture's video is
   chosen, the five materials are ticked, «Запустить анализ», the five rows get ready, the summary opens: its key
   points, then a section with the chip of the lecture's fragment it is taken from. Real time from 1.6 s; the key points and the
   section hold for reading. The results' top with its tabs is left out: there the self-check is still called
   «Тест», its name before 22.10 (the tile and the row «Тест» of the upload stay, they are the same thing).
   Frames: ffmpeg -i media/product/masters/lecture-master.mp4 -vf fps=30 -q:v 2 media/gen/footage/lecture/m-%04d.jpg
   Rendered: node deck/cf11/motion/render.mjs lecture-film --fps 30 --blur 4 --jobs 4 --crf 18 */
const M0 = 1.6;
const f = (m) => m - M0;
const K = 1.5;
const T = 22.0;
screenFilm({
  footage: '../media/gen/footage/lecture/', frames: 900, fps: 30, src: [1536, 1200],
  T, seam: 0.5,
  pieces: [
    { f0: 0, m0: M0, m1: 14.05 },                 // from the ways in to the five rows, all ready
    { f0: 13.0, m0: 16.0, m1: 17.0, fade: 0.4 },  // the summary's key points (the page's top, with the tabs, is left out)
    { f0: 15.6, m0: 17.5, m1: 18.5, fade: 0.4 },  // a section and its fragment chip
  ],
  cam0: [0, 150, 1536],
  moves: [
    { at: 0.4, dur: 3.8, box: [60, 290, 1416] },            // a slow push to the ways in and the chosen file
    { at: f(7.15), dur: 0.9, box: [0, 380, 1536] },         // the five materials
    { at: f(10.25), dur: 0.8, box: [0, 200, 1536] },        // «Запустить анализ»
    { at: f(12.0), dur: 0.9, box: [130, 390, 1280] },       // the five rows getting ready
    { at: 12.9, dur: 0.7, box: [60, 380, 1416] },           // the key points
    { at: 15.5, dur: 0.6, box: [60, 200, 1416] },           // a section
    { at: 17.0, dur: 1.4, box: [60, 400, 1416] },           // down to its fragment chip
  ],
  caps: [
    { from: 0.3, to: f(7.1), text: 'Лекцию загружают файлом, текстом, ссылкой или записью' },
    { from: f(7.5), to: f(10.9), text: 'Студент выбирает, что сделать из лекции' },
    { from: f(11.4), to: 12.8, text: 'Meldy читает лекцию и готовит материалы' },
    { from: 13.2, to: 15.4, text: 'Сначала конспект с главными тезисами' },
    { from: 15.9, to: T, text: 'У каждого раздела видно, откуда в лекции он взят' },
  ],
  taps: [
    { f: f(3.1), x: 853.8 * K, y: 316.9 * K }, { f: f(5.247), x: 512 * K, y: 528.3 * K }, { f: f(7.633), x: 222.7 * K, y: 538 * K },
    { f: f(9.699), x: 512 * K, y: 538 * K }, { f: f(11.039), x: 512 * K, y: 185.8 * K },
  ],
  spots: [{ from: 18.5, to: T - 0.5, box: [128, 806, 196, 56], radius: 28, a: 0.12 }],
  poster: 8600,
});
</script>
</body>
</html>
