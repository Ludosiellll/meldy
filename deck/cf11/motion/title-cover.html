<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>title-cover — ответ вслух</title>
<link rel="stylesheet" href="clip.css">
<style>
/* The title's right card: one oral answer in Meldy, as the app draws it on the light paper (frontend/src/components/
   oral: TicketCard, LiveTranscript, OralProtocol, ExaminerLine; tokens of index.css and oral.css). Question 18 of the
   oral exam «Базы данных» of test account A, the answer of the recording of 21.10 (tools/record/answers-08.json,
   media/product/08-oral-answer.mp4) and the points of its protocol (take 08-k): 1 and 3 «раскрыт», 2 «упомянут»
   (the examiner asks about it), «Сами назвали 2 из 3 главных пунктов».
   The GIF is the card itself at 1:1 on the slide (752 × 880), its corners the dark stage's canvas. Its first frame
   is the poster: the whole answer at once (the ticket, the voice's 0:14, the points checked, the examiner's
   question). From there the loop clears the sheet, the voice records and the words come in phrase by phrase, the
   check opens the points one by one and the count rolls, the examiner's card comes up and its question is typed,
   and the card holds on the state it started from. Nothing on it is smaller than 28 px.
   Rendered: node deck/cf11/motion/render.mjs title-cover --gif --gif-fps 12.5 --gif-colors 64 --no-mp4, then
   media/gen/title-cover.gif and .png copied to media/motion/ (committed: the build needs no browser render). */
html, body { background: #0b0f16; }
.frame { position: relative; width: 752px; height: 880px; overflow: hidden; background: #0b0f16; }
.frame > .stage { position: absolute; left: 0; top: 0; width: 752px; height: 880px; border-radius: 40px; }
.stage .in { position: static; }

.pill { left: 40px; top: 40px; height: 56px; padding: 0 26px; border-radius: 28px; background: #10295a; color: #fff;
  font-size: 28px; line-height: 56px; font-weight: 600; white-space: nowrap; }
.voice { top: 40px; right: 40px; width: 356px; height: 56px; border-radius: 28px; background: var(--canvas); }
.mic { left: 8px; top: 8px; width: 40px; height: 40px; border-radius: 20px; }
.mic svg { position: absolute; left: 10px; top: 10px; width: 20px; height: 20px; }
.bars { left: 62px; top: 10px; width: 196px; height: 36px; }
.bars i { position: absolute; width: 5px; border-radius: 3px; }
.time { right: 24px; top: 0; line-height: 56px; font-size: 30px; font-weight: 600; font-variant-numeric: tabular-nums;
  letter-spacing: -.01em; white-space: nowrap; }

.stem { left: 40px; top: 122px; width: 672px; font-size: 40px; line-height: 48px; font-weight: 600; letter-spacing: -.026em; white-space: nowrap; }

.count { left: 40px; top: 302px; width: 672px; height: 40px; font-size: 32px; line-height: 40px; font-weight: 600;
  letter-spacing: -.015em; white-space: nowrap; }
.roll { position: relative !important; display: inline-block; width: .62em; height: 40px; overflow: hidden; vertical-align: top; text-align: center; }
.roll b { position: absolute; left: 0; right: 0; top: 0; font-weight: 600; font-variant-numeric: tabular-nums; }

.row { left: 28px; width: 696px; height: 80px; border-radius: 24px; }
.row .n { left: 12px; top: 4px; width: 44px; height: 44px; border-radius: 22px; background: #efefea; color: var(--muted);
  font-size: 28px; line-height: 44px; font-weight: 600; text-align: center; font-variant-numeric: tabular-nums; }
.row .bar { left: 72px; top: 18px; height: 16px; border-radius: 8px; background: #efefea; }
.row .t { left: 72px; top: 4px; width: 608px; font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -.012em; color: var(--ink); }
.row .m { left: 12px; top: 4px; width: 44px; height: 44px; border-radius: 22px; }
.row .m svg { position: absolute; left: 0; top: 0; width: 44px; height: 44px; overflow: visible; }

.said { left: 40px; width: 672px; }
.said .lab { left: 0; top: 0; font-size: 28px; line-height: 36px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.said .tx { left: 0; top: 44px; width: 672px; font-size: 32px; line-height: 44px; color: var(--ink); }
.said .tx span { position: static; border-radius: 8px; }

.exam { left: 28px; width: 696px; height: 228px; border-radius: 32px; background: #e8effc; box-shadow: inset 0 0 0 2px #d7e3fa; }
.exam .av { left: 24px; top: 22px; width: 48px; height: 48px; border-radius: 24px; background: #10295a; color: #fff;
  font-size: 28px; line-height: 48px; font-weight: 600; text-align: center; }
.exam .who { left: 86px; top: 22px; font-size: 28px; line-height: 48px; font-weight: 600; color: #1f5bc6; white-space: nowrap; }
.exam .q { left: 24px; top: 84px; width: 648px; font-size: 34px; line-height: 40px; font-weight: 500; letter-spacing: -.022em; color: var(--ink); }
.exam .q span { position: static; }
</style>
</head>
<body>
<div class="frame">
<div class="stage" id="stage">
  <div class="pill">Вопрос 18</div>
  <div class="voice" id="voice">
    <div class="mic" id="mic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" id="micsvg"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
    <div class="bars" id="bars"></div>
    <div class="time" id="time">0:00</div>
  </div>
  <div class="stem">Параллельное выполнение<br>транзакций: аномалии<br>и уровни изоляции.</div>

  <div class="count" id="count"><span class="in">Сами назвали </span><span class="roll" id="roll"><b id="r1">2</b><b id="r2"></b></span><span class="in"> из 3 главных пунктов</span></div>
  <div id="rows"></div>

  <div class="said" id="said"><div class="lab">Ваш ответ</div><div class="tx" id="tx"></div></div>
  <div class="exam" id="exam"><div class="av">Э</div><div class="who">Экзаменатор</div><div class="q" id="q"></div></div>
</div>
</div>
<script src="clip.js"></script>
<script>
(() => {
  const { seg, mix, el, E, clamp } = window.M;
  // Story time s (ms): the sheet is clear at 0, the answer is whole from HOLD on. The GIF starts at s = START, inside
  // the hold, so its first frame (the poster) is the whole answer and the loop's seam falls inside the same hold.
  const T = 13000;
  const START = 10700;

  // The voice: on at 600, off at 5300 («Готово»); the timer reads 0:00 → 0:14 meanwhile.
  const V_ON = 600, V_OFF = 5300;
  // The answer as the server's recognition writes it: a phrase after each pause, first in the muted colour of words
  // still being recognised, then in ink. [text, shown at, final at]
  const PHRASES = [
    ['При параллельном выполнении', 1000, 1450],
    ['транзакций возникают аномалии.', 1650, 2150],
    ['Чтобы с\u00a0ними бороться,', 2550, 3000],
    ['в стандарте SQL есть', 3250, 3700],
    ['четыре уровня изоляции.', 3950, 4450],
  ];
  // The points of the protocol: [title, status, opens at, the transcript's words it was counted for]
  const POINTS = [
    ['Возникновение аномалий при\u00a0параллельном выполнении транзакций', 'ok', 5800, [0, 1]],
    ['Четыре аномалии параллельного выполнения транзакций', 'half', 7100, null],
    ['Уровни изоляции транзакций в\u00a0стандарте\u00a0SQL', 'ok', 6450, [3, 4]],
  ];
  const BARW = [420, 330, 380];
  const COUNT_IN = 5550;
  const ASK = 7900;           // the examiner's card comes up, the transcript goes
  const TYPE_FROM = 8600, TYPE_CPS = 36;
  const QUESTION = '«В чём разница между неповторяющимся чтением и\u00a0фантомным чтением?»';
  const RESET = 12350;        // the hold ends: the sheet clears for the next answer

  const C = { ink: '#0b121c', muted: '#4b515b', faint: '#8a8f97', blue: '#2869dd', canvas: '#f3f3f0', okBg: '#e2f2e5',
    okFg: '#2c6b3a', halfBg: '#fcefc9', halfFg: '#7a5a12', paper: '#ffffff' };

  // ---- build
  const stage = document.getElementById('stage');
  const ROW_TOP = 350, ROW_H = 80, ROW_GAP = 2;
  const rows = POINTS.map(([title, status], i) => {
    const r = el(stage, 'row');
    r.style.top = `${ROW_TOP + i * (ROW_H + ROW_GAP)}px`;
    // the asked row's tint and the rule between rows
    const n = el(r, 'n', String(i === 0 ? 1 : i === 1 ? 2 : 3));
    const bar = el(r, 'bar');
    bar.style.width = `${BARW[i]}px`;
    const t = el(r, 't', title);
    const m = el(r, 'm');
    m.innerHTML = status === 'ok'
      ? '<svg viewBox="0 0 44 44"><path d="M13.5 22.5 L19.5 28.5 L31 16" fill="none" stroke="#2c6b3a" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 1"/></svg>'
      : '<svg viewBox="0 0 44 44"><path d="M12 18.5 A10 9.5 0 0 0 32 18.5" fill="none" stroke="#7a5a12" stroke-width="3.6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/></svg>';
    m.style.background = status === 'ok' ? C.okBg : C.halfBg;
    return { r, n, bar, t, m, path: m.querySelector('path'), status };
  });
  // the order on the sheet is 1, 2, 3 (the rows above are built in that order)
  const SAID_TOP = 624;
  const said = document.getElementById('said');
  said.style.top = `${SAID_TOP}px`;
  const tx = document.getElementById('tx');
  const words = [];
  PHRASES.forEach(([text], i) => {
    const s = document.createElement('span');
    s.textContent = text + (i < PHRASES.length - 1 ? ' ' : '');
    tx.appendChild(s);
    words.push(s);
  });
  const exam = document.getElementById('exam');
  exam.style.top = `${SAID_TOP - 8}px`;
  const q = document.getElementById('q');
  const chars = [...QUESTION].map((ch) => { const s = document.createElement('span'); s.textContent = ch; q.appendChild(s); return s; });
  const bars = document.getElementById('bars');
  const BARS = 22;
  const barEls = Array.from({ length: BARS }, (_, j) => { const b = document.createElement('i'); b.style.left = `${j * 9}px`; bars.appendChild(b); return b; });
  const mic = document.getElementById('mic'), micsvg = document.getElementById('micsvg');
  const time = document.getElementById('time');
  const count = document.getElementById('count');
  const r1 = document.getElementById('r1'), r2 = document.getElementById('r2');

  const rgb = (h) => [1, 3, 5].map((k) => parseInt(h.slice(k, k + 2), 16));
  const mixc = (a, b, p) => { const x = rgb(a), y = rgb(b); return `rgb(${x.map((v, k) => Math.round(v + (y[k] - v) * p)).join(',')})`; };

  function story(s) {
    // the reset: everything the answer added leaves together, eased, before the sheet starts again at s = 0
    const out = s >= RESET ? seg(s, RESET, RESET + 400, E.inOut3) : 0;
    const keep = 1 - out;
    const sAt = s;

    // ---- the voice
    const on = seg(s, V_ON, V_ON + 300, E.inOut3) * (1 - seg(s, V_OFF, V_OFF + 350, E.inOut3));
    mic.style.background = mixc(C.paper, C.blue, on);
    micsvg.setAttribute('stroke', mixc(C.ink, C.paper, on));
    const secs = s < V_ON ? 0 : s >= RESET ? 14 : clamp(Math.floor(((s - V_ON) / (V_OFF - V_ON)) * 14.999), 0, 14);
    const shown = s >= RESET + 200 ? 0 : secs;
    time.textContent = `0:${String(shown).padStart(2, '0')}`;
    time.style.color = mixc(C.muted, C.ink, on);
    // the level: louder while a phrase is spoken, low in the pauses (when the words come in)
    let loud = 0;
    PHRASES.forEach(([, a]) => { const from = a - 750, to = a - 80; loud = Math.max(loud, seg(s, from, from + 160, E.inOut3) * (1 - seg(s, to - 160, to, E.inOut3))); });
    const level = on * (0.18 + 0.82 * loud);
    barEls.forEach((b, j) => {
      const w = s / 1000;
      const k = 0.5 + 0.5 * Math.sin(w * 9.1 + j * 1.31) * Math.sin(w * 5.3 + j * 0.71 + 1.7);
      const env = 0.55 + 0.45 * Math.sin(Math.PI * (j + 0.5) / BARS);
      const h = 6 + 28 * clamp(k * env * level * 1.35);
      b.style.height = `${h.toFixed(1)}px`;
      b.style.top = `${(18 - h / 2).toFixed(1)}px`;
      b.style.background = mixc('#b9bec6', C.blue, on);
    });

    // ---- the transcript: each phrase comes in muted and turns to ink; it leaves when the examiner asks
    const away = seg(s, ASK - 150, ASK + 200, E.inOut3);
    said.style.opacity = String((1 - away) * (s >= RESET ? 0 : 1) * seg(s, 250, 650, E.inOut3));
    said.style.transform = `translateY(${(-10 * away).toFixed(2)}px)`;
    PHRASES.forEach(([, a, b], i) => {
      const w = words[i];
      const inn = seg(s, a, a + 260, E.out3);
      const fin = seg(s, b, b + 260, E.inOut3);
      w.style.opacity = String(inn);
      w.style.color = mixc(C.faint, C.ink, fin);
      w.style.background = 'transparent';
    });
    // the words a point was counted for get its tint as the point opens
    POINTS.forEach(([, st, at, span]) => {
      if (!span) return;
      const p = seg(s, at + 150, at + 450, E.inOut3);
      for (let k = span[0]; k <= span[1]; k += 1) if (p > 0) words[k].style.background = mixc(C.paper, C.okBg, p);
    });

    // ---- the points: closed bars while the student speaks; the check opens them one by one
    rows.forEach((x, i) => {
      const at = POINTS[i][2];
      const open = seg(sAt, at + 120, at + 480, E.inOut3) * keep;
      const shut = 1 - seg(sAt, at, at + 220, E.inOut3) * keep;
      const mark = seg(sAt, at + 120, at + 520, E.out5) * keep;
      const draw = seg(sAt, at + 260, at + 620, E.inOut3) * keep;
      x.bar.style.opacity = String(shut);
      x.bar.style.transform = `scaleX(${(0.9 + 0.1 * shut).toFixed(3)})`;
      x.bar.style.transformOrigin = '0 50%';
      x.t.style.opacity = String(open);
      x.t.style.transform = `translateY(${(6 * (1 - open)).toFixed(2)}px)`;
      x.m.style.opacity = String(Math.min(1, mark * 1.6));
      x.n.style.opacity = String(1 - Math.min(1, mark * 1.6));
      x.m.style.transform = `scale(${(0.6 + 0.4 * mark).toFixed(3)})`;
      x.path.setAttribute('stroke-dashoffset', (1 - draw).toFixed(3));
    });
    // the asked point (2): the yellow of «упомянут» behind its row while the examiner asks about it
    const asked = seg(sAt, ASK + 150, ASK + 600, E.inOut3) * keep;
    rows[1].r.style.background = mixc(C.paper, C.halfBg, asked);
    rows[1].m.style.background = mixc(C.halfBg, C.paper, asked);

    // ---- the count: comes in with the check, the number rolls up as each point is ticked
    const cin = seg(sAt, COUNT_IN, COUNT_IN + 400, E.inOut3) * keep;
    count.style.opacity = String(cin);
    count.style.transform = `translateY(${(8 * (1 - cin)).toFixed(2)}px)`;
    const ticks = POINTS.filter(([, st]) => st === 'ok').map(([, , at]) => at + 300).sort((a, b) => a - b);
    let n = 0, last = null;
    ticks.forEach((at) => { if (sAt >= at) { n += 1; last = at; } });
    const roll = last == null ? 1 : seg(sAt, last, last + 320, E.out3);
    r1.textContent = String(n);
    r2.textContent = roll < 1 ? String(n - 1) : '';
    r1.style.transform = `translateY(${((1 - roll) * 100).toFixed(2)}%)`;
    r2.style.transform = `translateY(${(-roll * 100).toFixed(2)}%)`;
    r1.style.opacity = String(roll);
    r2.style.opacity = String(1 - roll);

    // ---- the examiner: the card comes up in the transcript's place, the question is typed into it
    const up = seg(sAt, ASK + 200, ASK + 620, E.out3) * keep;
    exam.style.opacity = String(up);
    exam.style.transform = `translateY(${(28 * (1 - up)).toFixed(2)}px)`;
    chars.forEach((c, k) => {
      const at = TYPE_FROM + (k * 1000) / TYPE_CPS;
      c.style.opacity = String(seg(sAt, at, at + 90, E.lin) * keep);
    });
  }

  function seek(t) { story((t + START) % T); }
  seek(0);
  window.__clip = { T, seek, width: 752, height: 880, poster: 0, loop: true };
})();
</script>
</body>
</html>
