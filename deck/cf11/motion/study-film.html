<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>study-film — по материалам лекцию учат: карточки, самопроверка, подкаст</title>
<link rel="stylesheet" href="clip.css">
<link rel="stylesheet" href="screen-film.css">
</head>
<body>
<div class="stage" id="stage"></div>
<script src="clip.js"></script>
<script src="../media/gen/footage/study-take/take.js"></script>
<script src="take-film.js"></script>
<script>
/* The stage version's slide 08, re-shot on today's app (13.11; the owner on the old film: «не видно, как
   разговаривают собеседники»). A take of the local copy of today's code on the saved lecture's page: a card is
   turned over, question 1 of the self-check is answered, the check shows its explanation, the podcast plays and both
   hosts speak in turn (Макс, Софья, Макс, Софья) — the WHOLE player stays in the frame. The sound of the take is a
   quiet tone per line (the film has no sound); the player advances by itself.
   Today's self-check explains the answers after all five are given and «Проверить ответы» is pressed: the film
   leaves out questions 2–5 (a crossfade).
   Footage: media/gen/footage/study-take (take_footage.py; ignored by git).
   Rendered: node deck/cf11/motion/render.mjs study-film --fps 30 --blur 4 --jobs 4 --crf 18 */
const { fit, whole, mark, cuts } = takeFilmTools;
const { pieces, end, F } = cuts([
  [0.2, mark('flipped') + 2.5],                                   // the lecture's page, «Карточки», a card is turned over
  [mark('quiz') - 0.3, mark('answered') + 1.5, 0.3],              // the self-check: question 1 is answered
  [mark('explained') - 0.4, mark('explained') + 3.0, 0.3],        // the check: the explanation
  [mark('player') - 0.4, mark('pause') - 0.2, 0.35],              // the podcast: four lines, the two hosts in turn
]);
const T = end + 0.6;
takeFilm({
  footage: '../media/gen/footage/study-take/', T, seam: 0.5, pieces,
  moves: [
    { at: F(0, mark('cards')) - 0.2, dur: 1.3, box: [270, 198, 1300] },                            // the cards: the camera's top edge stands between the lecture's tabs and the line under them
    { at: pieces[1].f0 - 0.2, dur: 0.9, box: fit([268, 276, 1572, 654], { pad: 30 }) },            // the question
    { at: pieces[2].f0 - 0.2, dur: 0.9, box: fit([268, 276, 1572, 719], { pad: 30 }) },            // its explanation
    { at: pieces[3].f0 - 0.2, dur: 0.9, box: whole() },                                            // the podcast: the page, whole
    { at: F(3, mark('play')) - 0.2, dur: 1.4, box: [238, 188, 1364] },                             // the whole player, nothing of it cut
  ],
  caps: [
    { from: F(0, mark('cards')) + 0.2, to: pieces[1].f0 - 0.1, text: 'По карточкам лекцию повторяют' },
    { from: pieces[1].f0 + 0.4, to: pieces[3].f0 - 0.1, text: 'В самопроверке к каждому ответу есть пояснение' },
    { from: pieces[3].f0 + 0.4, to: T, text: 'В подкасте лекцию обсуждают двое ведущих' },
  ],
});
window.__film = { T, pieces };
</script>
</body>
</html>
