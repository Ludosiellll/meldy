<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>sheet — шпаргалка за два дня ответов</title>
<link rel="stylesheet" href="clip.css">
<style>
/* Slide 09's window (its screen, 1080 × 544): the exam page's cheat sheet in the new look, cropped like a
   recording. Monday, an answer aloud names three lines once (yellow dots). Tuesday, the next answer erases the
   two named again (a strike drawn left to right), names one for the first time, and the one it missed comes
   back; the counter and the map follow. The last second dissolves back into the first frame. */
/* Round 2: the laptop's screen inside its ink bezel on the slide, 1152 × 568. The 1080 × 544 layout below is drawn
   at ×1.0441 (568 / 544), centred; the rounded screen is the canvas, the corners outside it the bezel's ink. */
.device { position: relative; width: 1152px; height: 568px; overflow: hidden; background: #0b121c; }
.device > .screenbg { position: absolute; left: 0; top: 0; width: 1152px; height: 568px; border-radius: 22px; background: var(--canvas); }
.device > .fit { position: absolute; left: 12px; top: 0; width: 1080px; height: 544px; transform: scale(1.0441); transform-origin: 0 0; }
.stage { width: 1080px; height: 544px; background: transparent; }
.screen { left: 0; top: 0; width: 1080px; height: 544px; border-radius: 24px; background: var(--canvas); overflow: hidden; }
.card { background: var(--surface); border-radius: 28px; box-shadow: 0 0 0 1px rgba(11, 18, 28, .06), 0 24px 48px -36px rgba(11, 18, 28, .30); }
.date { left: 56px; top: 50px; width: 230px; height: 44px; border-radius: 22px; background: var(--tint); overflow: hidden; }
.date div { left: 0; right: 0; top: 0; height: 44px; line-height: 44px; text-align: center; font-size: 24px; color: var(--muted); white-space: nowrap; }
.voice { left: 424px; top: 50px; width: 208px; height: 44px; border-radius: 22px; background: var(--canvas); }
.voice .mic { left: 6px; top: 6px; width: 32px; height: 32px; border-radius: 16px; background: var(--ink); }
.voice .mic svg { position: absolute; left: 8px; top: 8px; width: 16px; height: 16px; }
.voice .wave { left: 48px; top: 8px; width: 96px; height: 28px; }
.voice .wave i { position: absolute; width: 4px; border-radius: 2px; background: var(--ink); }
.voice .time { left: 148px; top: 0; width: 48px; line-height: 44px; font-size: 22px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.qt { left: 56px; font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.qt b { font-weight: 500; color: var(--faint); }
.ln { left: 56px; width: 580px; height: 40px; }
.ln .mk { left: 6px; top: 15px; width: 10px; height: 10px; border-radius: 5px; background: var(--ink); }
.ln .tx { left: 36px; top: 0; font-size: 26px; line-height: 40px; white-space: nowrap; }
.ln .st { left: 32px; top: 21px; height: 2px; border-radius: 1px; background: var(--faint); transform-origin: 0 50%; }
.ln .nt { left: 36px; top: 36px; font-size: 20px; line-height: 24px; color: var(--muted); white-space: nowrap; }
.ln .nt em { font-style: normal; font-weight: 500; color: var(--blue-fg); }
.tagx { left: 716px; top: 52px; height: 40px; padding: 0 30px 0 16px; font-size: 24px; display: flex; align-items: center; font-weight: 500; background: var(--pink); clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 50%, 100% 100%, 0 100%); }
.count { left: 712px; top: 104px; width: 124px; height: 104px; overflow: hidden; }
.count div { left: 0; right: 0; top: 0; height: 104px; font-size: 96px; line-height: 104px; font-weight: 600; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.c1 { left: 844px; top: 132px; font-size: 26px; line-height: 32px; white-space: nowrap; }
.c2 { left: 844px; top: 164px; font-size: 26px; line-height: 32px; color: var(--muted); white-space: nowrap; }
.sub { left: 716px; top: 222px; font-size: 22px; line-height: 28px; color: var(--muted); white-space: nowrap; }
.panel { left: 716px; top: 268px; width: 312px; height: 228px; border-radius: 20px; background: var(--canvas); }
.map i { position: absolute; width: 20px; height: 20px; border-radius: 5px; }
</style>
</head>
<body>
<div class="device">
<div class="screenbg"></div>
<div class="fit">
<div class="stage" id="stage">
  <div class="screen">
    <div class="card" style="left:24px;top:24px;width:640px;height:496px"></div>
    <div class="card" style="left:688px;top:24px;width:368px;height:496px"></div>
  </div>
  <div class="date"><div id="d1">Пн, 12 октября</div><div id="d2">Вт, 13 октября</div></div>
  <div class="voice" id="voice">
    <div class="mic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
    <div class="wave" id="wave"></div>
    <div class="time" id="time">0:00</div>
  </div>
  <div class="qt" style="top:120px"><b>4.</b> Рыночное равновесие</div>
  <div id="q1"></div>
  <div class="qt" id="q2t"><b>6.</b> Эластичность спроса по&nbsp;цене</div>
  <div id="q2"></div>
  <div class="tagx">Шпаргалка</div>
  <div class="count"><div id="n1">44</div><div id="n2"></div></div>
  <div class="c1" id="c1">строки осталось</div>
  <div class="c2">из 63</div>
  <div class="sub" id="sub">стёрто 19 · названо один раз 6</div>
  <div class="panel"></div>
  <div class="map" id="map"></div>
</div>
<div id="loop" style="position:absolute;left:0;top:0;width:1080px;height:544px;opacity:0"></div>
</div>
</div>
<script src="clip.js"></script>
<script>
(() => {
  const { seg, mix, el, E, clamp } = window.M;
  const T = 10400;
  const RGB = { ink: [11, 18, 28], muted: [75, 81, 91], faint: [138, 143, 151], named: [233, 177, 60] };
  const lerp = (a, b, p) => a.map((v, i) => v + (b[i] - v) * p);
  const css = (c) => `rgb(${c.map((v) => Math.round(v)).join(',')})`;

  // The six lines on screen: their kind, where they sit in the map, and what happens to them.
  //   start: 'ink' remains | 'named' named once before;   mon: named on Monday;   tue: 'erase' | 'name' | 'miss'
  const LINES = [
    { q: 1, text: 'равновесие: спрос равен предложению', kind: 'm', map: 14, start: 'ink', mon: 1300, tue: ['erase', 4700] },
    { q: 1, text: 'цена выше равновесной → излишек', kind: 'm', map: 15, start: 'ink', mon: 1650, tue: ['erase', 5150] },
    { q: 1, text: 'цена ниже равновесной → дефицит', kind: 'm', map: 16, start: 'ink', mon: null, tue: ['name', 5600] },
    { q: 1, text: 'сдвиг кривой меняет цену и объём', kind: 'd', map: 17, start: 'ink', mon: 2000, tue: ['miss', 6050] },
    { q: 2, text: '|E| > 1 — спрос эластичный', kind: 'm', map: 24, start: 'named', mon: null, tue: ['erase', 6600] },
    { q: 2, text: '|E| < 1 — спрос неэластичный', kind: 'm', map: 25, start: 'ink', mon: null, tue: null },
  ];
  const q1 = document.getElementById('q1'), q2 = document.getElementById('q2'), q2t = document.getElementById('q2t');
  const rows = LINES.map((L) => {
    const r = el(L.q === 1 ? q1 : q2, 'ln');
    const mk = el(r, 'mk'), tx = el(r, 'tx', L.text), st = el(r, 'st');
    const nt = el(r, 'nt'); nt.innerHTML = 'не названа <em>13 окт.</em>';
    return { L, r, mk, tx, st, nt };
  });
  rows.forEach((x) => { x.st.style.width = `${x.tx.offsetWidth + 10}px`; });

  // The map of the whole sheet: 63 lines of 12 questions. Before Monday: 19 erased, 6 named once.
  const N = 63;
  const GONE = new Set([0, 1, 2, 5, 6, 8, 9, 10, 11, 19, 20, 27, 28, 33, 40, 41, 47, 52, 58]);
  const NAMED = new Set([3, 12, 24, 30, 36, 44]);
  const map = document.getElementById('map');
  const squares = Array.from({ length: N }, (_, i) => {
    const s = document.createElement('i');
    s.style.left = `${736 + (i % 10) * 28}px`;
    s.style.top = `${288 + Math.floor(i / 10) * 28}px`;
    map.appendChild(s);
    return s;
  });
  const paint = (s, state, p = 1) => {
    // state: [ink|named|gone] blend described by fill colour and outline alpha
    if (state.gone > 0.5) { s.style.transform = 'none'; s.style.background = 'transparent'; s.style.boxShadow = `inset 0 0 0 2px rgba(138,143,151,${(0.55 * clamp((state.gone - 0.5) * 2)).toFixed(3)})`; s.style.opacity = '1'; }
    else {
      s.style.background = css(state.named >= 0.5 ? RGB.named : RGB.ink); s.style.boxShadow = 'none'; s.style.opacity = String(1 - state.gone * 2);
      s.style.transform = `scale(${(1 - 0.4 * Math.sin(Math.PI * clamp(state.named))).toFixed(3)})`;
    }
  };
  const wave = document.getElementById('wave');
  const bars = Array.from({ length: 12 }, (_, j) => { const b = document.createElement('i'); b.style.left = `${j * 8}px`; wave.appendChild(b); return b; });
  const voice = document.getElementById('voice'), time = document.getElementById('time');
  const d1 = document.getElementById('d1'), d2 = document.getElementById('d2');
  const n1 = document.getElementById('n1'), n2 = document.getElementById('n2'), sub = document.getElementById('sub'), c1 = document.getElementById('c1');
  const plural = (n) => (n % 10 === 1 && n % 100 !== 11 ? 'строка осталась' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? 'строки осталось' : 'строк осталось');
  const loop = document.getElementById('loop');

  function lineState(L, t) {
    // named: 0..1 toward yellow; gone: 0..1 erased; note: the «не названа» line under a missed one.
    let named = L.start === 'named' ? 1 : 0, gone = 0, note = 0, strike = 0;
    if (L.mon != null) named = Math.max(named, seg(t, L.mon, L.mon + 320, E.out3));
    if (L.tue) {
      const [what, at] = L.tue;
      if (what === 'erase') { const e = seg(t, at, at + 420, E.inOut3); gone = e; strike = e; }
      if (what === 'name') named = Math.max(named, seg(t, at, at + 320, E.out3));
      if (what === 'miss') { const m = seg(t, at, at + 380, E.inOut3); named *= 1 - m; note = m; }
    }
    return { named, gone, note, strike };
  }

  function seek(t) {
    let erased = 0, namedCount = 0;
    let shift = 0;
    rows.forEach((x, i) => {
      const s = lineState(x.L, t);
      const detail = x.L.kind === 'd';
      const w = detail ? mix(14, 10, s.named) : 10, h = detail ? mix(2, 10, s.named) : 10;
      x.mk.style.width = `${w}px`; x.mk.style.height = `${h}px`;
      x.mk.style.left = `${detail ? 4 + (14 - w) / 2 : 6}px`; x.mk.style.top = `${20 - h / 2}px`;
      x.mk.style.borderRadius = `${h / 2}px`;
      const pop = Math.sin(Math.PI * clamp(s.named));
      x.mk.style.background = css(s.named >= 0.5 ? RGB.named : detail ? RGB.muted : RGB.ink);
      x.mk.style.transform = `scale(${((1 - 0.6 * pop) * (1 - seg(s.gone, 0, 0.55))).toFixed(3)})`;
      x.tx.style.color = css(lerp(lerp(RGB.ink, RGB.muted, s.named), RGB.faint, s.gone));
      x.st.style.opacity = s.strike > 0 ? '1' : '0';
      x.st.style.transform = `scaleX(${s.strike})`;
      x.nt.style.opacity = String(s.note);
      // Rows of the first question stack from y 162; a note under a missed line pushes the rest down.
      const base = x.L.q === 1 ? 162 : 0;
      if (x.L.q === 1) { x.r.style.top = `${base + i * 40 + shift}px`; shift += 26 * s.note; }
      paint(squares[x.L.map], { named: s.named, gone: s.gone });
      if (s.gone >= 0.5) erased += 1;
      if (s.named >= 0.5 && s.gone < 0.5) namedCount += 1;
    });
    // The second question follows the first.
    const q2top = 338 + shift;
    q2t.style.top = `${q2top}px`;
    rows.filter((x) => x.L.q === 2).forEach((x, k) => { x.r.style.top = `${q2top + 44 + k * 40}px`; });
    // The rest of the map stays as it was.
    for (let i = 0; i < N; i += 1) {
      if (LINES.some((L) => L.map === i)) continue;
      paint(squares[i], { named: NAMED.has(i) ? 1 : 0, gone: GONE.has(i) ? 1 : 0 });
    }
    const goneTotal = GONE.size + erased;
    const namedTotal = NAMED.size - LINES.filter((L) => NAMED.has(L.map)).length + namedCount;
    const left = N - goneTotal;
    sub.textContent = `стёрто ${goneTotal} · названо один раз ${namedTotal}`;
    // The count rolls: down from below when a line is erased.
    const drops = LINES.filter((L) => L.tue && L.tue[0] === 'erase').map((L) => L.tue[1] + 210).filter((at) => t >= at);
    const last = drops.length ? Math.max(...drops) : null;
    const roll = last ? seg(t, last, last + 240, E.out3) : 1;
    n1.textContent = String(left);
    c1.textContent = plural(left);
    n2.textContent = roll < 1 ? String(left + 1) : '';
    n1.style.transform = `translateY(${((1 - roll) * 100).toFixed(2)}%)`;
    n2.style.transform = `translateY(${(-roll * 100).toFixed(2)}%)`;
    n1.style.opacity = String(roll); n2.style.opacity = String(1 - roll);
    // The voice: Monday's answer, then Tuesday's.
    const v = Math.max(seg(t, 900, 1150) * (1 - seg(t, 2500, 2750)), seg(t, 4250, 4500) * (1 - seg(t, 6950, 7200)));
    voice.style.opacity = String(v);
    const from = t >= 4250 && t < 7200 ? 4250 : t >= 900 && t < 2750 ? 900 : null;
    time.textContent = from == null ? '0:00' : `0:${String(clamp(Math.floor((t - from) / 160), 0, 18)).padStart(2, '0')}`;
    bars.forEach((b, j) => {
      const k = Math.abs(Math.sin(t / 88 + j * 1.9) * 0.55 + Math.sin(t / 39 + j * 0.8) * 0.45);
      const hh = 4 + 22 * k * v;
      b.style.height = `${hh.toFixed(1)}px`; b.style.top = `${(14 - hh / 2).toFixed(1)}px`;
    });
    // Monday becomes Tuesday between the answers.
    const d = seg(t, 3300, 3680, E.inOut3);
    d1.style.transform = `translateY(${(-d * 100).toFixed(2)}%)`; d1.style.opacity = String(1 - d);
    d2.style.transform = `translateY(${((1 - d) * 100).toFixed(2)}%)`; d2.style.opacity = String(d);
    // The last 800 ms dissolve into the first frame, so the loop has no seam.
    loop.style.opacity = String(seg(t, T - 800, T, E.inOut3));
  }
  seek(0);
  // Freeze a copy of the first frame for the dissolve at the end of the loop.
  loop.appendChild(document.getElementById('stage').cloneNode(true));
  loop.firstChild.id = '';
  window.__clip = { T, seek, width: 1152, height: 568, poster: 8200, loop: true };
})();
</script>
</body>
</html>
