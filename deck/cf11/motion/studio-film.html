<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>studio-film — преподаватель собирает тест и отправляет ссылку</title>
<link rel="stylesheet" href="clip.css">
<link rel="stylesheet" href="screen-film.css">
</head>
<body>
<div class="stage" id="stage"></div>
<script src="clip.js"></script>
<script src="../media/gen/footage/studio-take/take.js"></script>
<script src="take-film.js"></script>
<script>
/* The stage version's slide 11, re-shot on today's app (13.11; the owner on the old film: «очень быстро видео идёт,
   все действия слишком быстрые, слишком всё приближённо, момент, где должно показывать, как будет выглядеть для
   ученика, слишком приближённо»). A take of the local copy of today's code (tools/record/local.cjs): the test is
   named, the constructor opens on a page with a heading, a line of text and two questions from the lecture's
   self-check, a picture file is dragged onto the page, a «Верно / неверно» question is added and typed, a ready
   theme is chosen, the test is opened as a pupil sees it, «Отправить по ссылке», the link and its QR code.
   The camera stays wide: the whole constructor is seen, and the pupil's view is never cropped. The take is 79 s;
   the film leaves out the waits and the scrolling of panels (crossfades), every action itself runs in real time.
   Footage: media/gen/footage/studio-take (take_footage.py; ignored by git).
   Rendered: node deck/cf11/motion/render.mjs studio-film --fps 30 --blur 4 --jobs 4 --crf 18 */
const { fit, whole, mark } = takeFilmTools;
// The film's pieces, as stretches of the take: [from, to, fade]. A piece with no fade follows the one before it.
const CUTS = [
  [0.2, mark('name-typed') + 0.5],                                   // the name is typed
  [mark('create') + 0.4, mark('studio-open') - 0.15, 0.3],          // «Создать тест»
  [mark('studio-open') + 0.9, mark('picture-whole') + 1.8, 0.35],   // the constructor, whole; the picture is dragged in
  [mark('question-pick') - 0.6, mark('question-added') + 1.4, 0.3], // a question from the palette
  [mark('question-typing') - 0.4, mark('question-typed') + 1.0, 0.3],
  [mark('question-saved') + 0.9, mark('design-tab') + 1.9, 0.3],    // saved; the tab «Оформление»
  [mark('themes') - 0.2, mark('theme-chosen') + 2.7, 0.3],          // a ready theme
  [mark('preview-press') + 0.75, mark('preview-close') - 0.2, 0.3], // as a pupil sees it
  [mark('send') + 0.9, mark('get-link') + 1.6, 0.3],                // «Отправить по ссылке»
  [mark('get-link') + 1.6, mark('end') - 0.1],                      // the link and its QR code
];
const pieces = [];
let at = 0;
for (const [m0, m1, fade] of CUTS) {
  const f0 = fade ? at - fade : at;
  pieces.push({ f0, m0, m1, fade });
  at = f0 + (m1 - m0);
}
const T = at + 1.0;                       // the QR holds a second more, then the loop's dissolve
const F = (i, m) => pieces[i].f0 + (m - pieces[i].m0);   // the film second of take second m inside piece i
// A close view of the page alone: its left and right edges stand in the empty strips between the palette, the page
// and the settings (x 236–354 and 1354–1472), so no word of a panel is cut. Everything else is the whole screen.
const page = (y) => [290, y, 1130];
takeFilm({
  footage: '../media/gen/footage/studio-take/', T, seam: 0.5, pieces,
  moves: [
    { at: 1.2, dur: 1.3, box: fit([600, 76, 1240, 492], { pad: 40 }) },         // the card «Новый тест»
    { at: pieces[2].f0 - 0.2, dur: 0.9, box: whole() },                         // the constructor, whole
    { at: F(2, mark('file-drag')) - 0.6, dur: 1.2, box: page(170) },            // the page: the file comes and is dropped
    { at: F(2, mark('picture-in')) + 0.5, dur: 1.3, box: whole() },             // the picture stands on the page
    { at: pieces[5].f0 - 0.2, dur: 0.9, box: page(220) },                       // the new question, saved
    { at: F(5, mark('design-tab')) + 0.3, dur: 1.1, box: whole() },             // the tab «Оформление», the themes
    { at: F(6, mark('theme-chosen')) + 0.9, dur: 1.2, box: page(190) },         // the page in its new look
    { at: pieces[7].f0 - 0.2, dur: 0.9, box: whole() },                         // as a pupil sees it: the whole screen
    { at: F(9, mark('link-open')) + 0.2, dur: 1.2, box: fit([268, 144, 1572, 414], { pad: 40 }) },   // the link
    { at: F(9, mark('qr-open')) - 0.5, dur: 1.0, box: whole() },                // the QR code
  ],
  caps: [
    { from: 0.4, to: pieces[2].f0 - 0.1, text: 'Тест начинается с названия' },
    { from: pieces[2].f0 + 0.4, to: F(2, mark('file-drag')) - 0.3, text: 'Страницу собирают из блоков' },
    { from: F(2, mark('file-drag')) + 0.1, to: pieces[3].f0 - 0.1, text: 'Картинку перетаскивают с компьютера' },
    { from: pieces[3].f0 + 0.4, to: pieces[5].f0 + 2.2, text: 'Вопрос добавляют одним нажатием' },
    { from: F(5, mark('design-tab')) + 0.9, to: pieces[7].f0 - 0.1, text: 'Оформление выбирают из готовых тем' },
    { from: pieces[7].f0 + 0.4, to: pieces[8].f0 - 0.1, text: 'Так тест увидит ученик' },
    { from: pieces[8].f0 + 0.4, to: T, text: 'Ученики получают ссылку и QR-код' },
  ],
});
window.__film = { T, pieces };
</script>
</body>
</html>
