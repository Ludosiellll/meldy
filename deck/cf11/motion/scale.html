<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>scale — одна строка → 229 тыс. студентов (ночное поле)</title>
<link rel="stylesheet" href="clip.css">
<style>
/* Slide 12 (dark stage): the clip's box is 1360 × 584 at x 560, y 384 of the slide, running off its right edge.
   One continuous pull-back on the night canvas of the app's dark theme: a line of the cheat sheet → its question →
   an exam of 400 questions → a group of 25 students (25 copies of the exam) → the field: 9 160 dots, one per group
   of 25, ≈ 229 thousand students. The yellow mark is always the same thing, one level up; at the end it is «your
   group». No text in the clip but the line and its question: the stops are named by live labels on the slide (the
   ladder), which build in time with the stops below (STOPS_AT). One shot: it holds its last frame, which is the
   poster. In the slideshow the clip fades in with its first frame, so the poster never jumps to it. */
html, body { background: #0b0f16; }
.stage { width: 1360px; height: 584px; background: #0b0f16; }
canvas { left: 0; top: 0; }
.preload { left: -9999px; top: 0; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="preload"><span style="font-weight:400">Аа</span><span style="font-weight:600">Аа</span></div>
</div>
<script src="clip.js"></script>
<script>
(() => {
  const { seg, mix, E, clamp, hash } = window.M;
  const T = 11000;
  const W = 1360, H = 584;
  // The dark theme (frontend/src/index.css .dark).
  const C = { canvas: '#0b0f16', surface: '#141a24', line: '#262e3b', ink: '243,243,240', muted: '167,173,183', yellow: '#f4c45b' };

  // ---- the world (units = screen px at the last stop) ----
  // 146 × 63 cells = 9198; the last row stops 38 short: exactly 9160 groups × 25 = 229 000 students.
  const COLS = 146, ROWS = 63, N = 9160;
  const CELL = Math.min(W / COLS, H / ROWS);
  const GX0 = (W - COLS * CELL) / 2, GY0 = (H - ROWS * CELL) / 2;
  const exists = (gc, gr) => gr * COLS + gc < N;
  const FC = 50, FR = 30;                              // «your group»: left of the middle, where the label fits
  const groupX = (c) => GX0 + c * CELL, groupY = (r) => GY0 + r * CELL;
  const CC = CELL / 5, CS = CC * 0.82;                 // a copy of the exam inside its group (5 × 5 students)
  const TC = CS / 20, TS = TC * 0.78;                  // a question inside a copy (20 × 20 = 400)
  const FCX = 2, FCY = 2, FTX = 9, FTY = 9;            // your copy and the question on screen
  const copyX = (gc, i) => groupX(gc) + (CELL - 5 * CC) / 2 + i * CC + (CC - CS) / 2;
  const copyY = (gr, j) => groupY(gr) + (CELL - 5 * CC) / 2 + j * CC + (CC - CS) / 2;
  const tileX = (cx, i) => cx + i * TC + (TC - TS) / 2;
  const tileY = (cy, j) => cy + j * TC + (TC - TS) / 2;
  const fcx = copyX(FC, FCX), fcy = copyY(FR, FCY);
  const ftx = tileX(fcx, FTX), fty = tileY(fcy, FTY);
  // The question's card around the question: 2 : 1, its first line the line of stop 1.
  const CARD_W = TS * 2.2, CARD_H = TS * 1.1;
  const cardX = ftx + TS / 2 - CARD_W / 2, cardY = fty + TS / 2 - CARD_H / 2;
  const LINES = ['спрос растёт → цена растёт', 'цена выше равновесной → излишек', 'цена ниже равновесной → дефицит', 'потолок цен → дефицит'];
  const lineY = (k) => cardY + CARD_H * (0.42 + k * 0.145);

  // Stops: scale (px per unit) and the point the camera holds.
  const S = [15000, 7000, 300, 52, 1];
  const P = [
    [cardX + CARD_W * 0.5, lineY(0)], // replaced by the centre of the line's words once the font is in (below)
    [cardX + CARD_W / 2, cardY + CARD_H / 2],
    [fcx + CS / 2, fcy + CS / 2],
    [groupX(FC) + CELL / 2, groupY(FR) + CELL / 2],
    [W / 2, H / 2],
  ];
  // Dwell, then move out: [start of the move, end of the move] from stop k to k + 1.
  const MOVES = [[900, 2200], [3000, 4500], [5300, 6600], [7400, 9000]];
  // When each stop is reached (the ladder of the old slide 12 built in at these times; unused since round 7).
  const STOPS_AT = [0, 2200, 4500, 6600, 9000];

  function camera(t) {
    let k = 0;
    while (k < MOVES.length && t >= MOVES[k][1]) k += 1;
    if (k === MOVES.length) return { s: S[4], c: P[4], stop: 4 };
    const [a, b] = MOVES[k];
    const p = t <= a ? 0 : E.inOut3(clamp((t - a) / (b - a)));
    const z = mix(Math.log(S[k]), Math.log(S[k + 1]), p);
    const s = Math.exp(z);
    // The held point moves in step with the zoom (in log space), so the motion has no swing.
    const q = (Math.log(S[k]) - z) / (Math.log(S[k]) - Math.log(S[k + 1]) || 1);
    const c = [mix(P[k][0], P[k + 1][0], q), mix(P[k][1], P[k + 1][1], q)];
    return { s, c, stop: p > 0.5 ? k + 1 : k };
  }

  const cv = document.getElementById('cv');
  const dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = `${W}px`; cv.style.height = `${H}px`;
  const g = cv.getContext('2d');
  const sm = (v, a, b) => { const x = clamp((v - a) / (b - a)); return x * x * (3 - 2 * x); };
  // A copy's progress, as the app's map shows it, in the order of the questions: the first ones erased.
  const erased = (gc, gr, i, j, ti, tj) => tj * 20 + ti < 60 + Math.floor(150 * hash(gc * 7 + i, gr * 3 + j));
  function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2)); }
  // The label's patch, in cells: from 2 cells right of your group, 23 cells long, 5 rows high.
  const hole = (gc, gr) => (gc >= FC + 2 && gc <= FC + 24 && gr >= FR - 2 && gr <= FR + 2 ? 1 : 0);

  function draw(t) {
    const { s, c, stop } = camera(t);
    const X = (wx) => (wx - c[0]) * s + W / 2, Y = (wy) => (wy - c[1]) * s + H / 2;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = C.canvas;
    g.fillRect(0, 0, W, H);
    const vx0 = c[0] - W / 2 / s, vx1 = c[0] + W / 2 / s, vy0 = c[1] - H / 2 / s, vy1 = c[1] + H / 2 / s;
    const gsz = CELL * s, csz = CS * s, tsz = TS * s;
    // Level of detail: a mark is never drawn smaller than about 4 px, so nothing turns into grain.
    const aDot = 1 - sm(gsz, 30, 80);                        // groups drawn as dots
    const aCopy = sm(gsz, 30, 80) * (1 - sm(csz, 110, 200));  // a group as its 25 copies
    const aTile = sm(csz, 110, 200) * (1 - sm(tsz, 26, 90));  // a copy as its 400 questions
    const aCard = sm(tsz, 26, 90);                           // the question as its card
    const dimG = 1 - 0.75 * sm(gsz, 120, 300);               // other groups recede once we are inside one
    const dimC = 1 - 0.75 * sm(csz, 160, 320);               // other copies recede once we are inside one
    const dimT = 1 - sm(tsz, 30, 70);                        // other questions come in only once they are small
    // While the camera travels out to the field, its dots stay quiet; they come up once it holds.
    const fieldUp = mix(0.35, 1, seg(t, 9000, 9700, E.inOut3));
    // A clear patch for the slide's live label «ваша группа», right of your group, as a map clears a place name.
    const holeOn = seg(t, 9300, 9900, E.inOut3);
    const gc0 = Math.max(0, Math.floor((vx0 - GX0) / CELL) - 1), gc1 = Math.min(COLS - 1, Math.ceil((vx1 - GX0) / CELL) + 1);
    const gr0 = Math.max(0, Math.floor((vy0 - GY0) / CELL) - 1), gr1 = Math.min(ROWS - 1, Math.ceil((vy1 - GY0) / CELL) + 1);
    for (let gr = gr0; gr <= gr1; gr += 1) {
      for (let gc = gc0; gc <= gc1; gc += 1) {
        if (!exists(gc, gr)) continue;
        const focalG = gc === FC && gr === FR;
        const ga = focalG ? 1 : Math.min(dimG, fieldUp);
        if (aDot > 0.001 && !focalG) {
          // a group: a muted dot, a little brighter here and there so the field reads as people, not a screen
          g.globalAlpha = aDot * fieldUp * (0.5 + 0.25 * hash(gc, gr)) * (1 - hole(gc, gr) * holeOn);
          g.fillStyle = `rgb(${C.muted})`;
          g.beginPath();
          g.arc(X(groupX(gc) + CELL / 2), Y(groupY(gr) + CELL / 2), Math.max(0.6, 0.23 * gsz), 0, Math.PI * 2);
          g.fill();
        }
        if (aCopy > 0.001 || aTile > 0.001 || aCard > 0.001) {
          for (let j = 0; j < 5; j += 1) {
            for (let i = 0; i < 5; i += 1) {
              const cx = copyX(gc, i), cy = copyY(gr, j);
              if (cx > vx1 || cx + CS < vx0 || cy > vy1 || cy + CS < vy0) continue;
              const focalC = focalG && i === FCX && j === FCY;
              const ca = ga * (focalC ? 1 : (focalG ? dimC : 1));
              if (aCopy > 0.001) {
                g.globalAlpha = aCopy * ca * (focalC ? 1 : 0.8);
                g.fillStyle = focalC ? C.yellow : `rgb(${C.ink})`;
                rr(X(cx), Y(cy), csz, csz, csz * 0.16);
                g.fill();
              }
              if ((aTile > 0.001 || aCard > 0.001) && csz > 20) {
                for (let tj = 0; tj < 20; tj += 1) {
                  for (let ti = 0; ti < 20; ti += 1) {
                    const tx = tileX(cx, ti), ty = tileY(cy, tj);
                    if (tx > vx1 || tx + TS < vx0 || ty > vy1 || ty + TS < vy0) continue;
                    const focalT = focalC && ti === FTX && tj === FTY;
                    const ta = ca * (focalT ? 1 : dimT) * aTile;
                    if (ta < 0.002) continue;
                    const sx = X(tx), sy = Y(ty);
                    g.globalAlpha = ta;
                    if (focalT) { g.fillStyle = C.yellow; rr(sx, sy, tsz, tsz, tsz * 0.2); g.fill(); }
                    else if (erased(gc, gr, i, j, ti, tj)) {
                      g.strokeStyle = `rgba(${C.muted},.5)`; g.lineWidth = Math.max(0.6, Math.min(2, tsz * 0.12));
                      rr(sx + g.lineWidth / 2, sy + g.lineWidth / 2, tsz - g.lineWidth, tsz - g.lineWidth, tsz * 0.2); g.stroke();
                    } else { g.fillStyle = `rgb(${C.ink})`; rr(sx, sy, tsz, tsz, tsz * 0.2); g.fill(); }
                  }
                }
              }
            }
          }
        }
      }
    }
    // Your group in the field: the yellow dot, three times a group's size, with a ring of the canvas around it.
    if (aDot > 0.001) {
      const fx = X(groupX(FC) + CELL / 2), fy = Y(groupY(FR) + CELL / 2);
      const d = 0.21 * gsz * mix(1, 2.6, sm(-Math.log(s), -1.2, 0));
      g.globalAlpha = aDot;
      g.fillStyle = C.canvas; g.beginPath(); g.arc(fx, fy, d + 5, 0, Math.PI * 2); g.fill();
      g.fillStyle = C.yellow; g.beginPath(); g.arc(fx, fy, d, 0, Math.PI * 2); g.fill();
      // and a thin ring that settles in when the field holds
      const ring = seg(t, 9300, 10100, E.out3);
      if (ring > 0) {
        g.globalAlpha = aDot * ring;
        g.strokeStyle = C.yellow; g.lineWidth = 2;
        g.beginPath(); g.arc(fx, fy, d + 12 + 10 * (1 - ring), 0, Math.PI * 2); g.stroke();
      }
    }
    // The question opens into its card: four lines, the first one the line we started from.
    if (aCard > 0.001) {
      const x = X(cardX), y = Y(cardY), w = CARD_W * s, h = CARD_H * s;
      g.globalAlpha = aCard;
      g.fillStyle = C.surface;
      rr(x, y, w, h, Math.min(28, w * 0.05)); g.fill();
      g.strokeStyle = C.line; g.lineWidth = 2; g.stroke();
      const u = h / 100; // card units
      const near = sm(s, 8500, 14000); // at the closest zoom, only the first line stays bright
      g.fillStyle = `rgb(${C.ink})`;
      g.globalAlpha = aCard * (1 - 0.88 * near);
      g.font = `600 ${(9 * u).toFixed(2)}px Onest`;
      g.textBaseline = 'alphabetic';
      g.fillText('Рыночное равновесие', x + 7 * u, y + 21 * u);
      LINES.forEach((line, k) => {
        const ly = Y(lineY(k));
        g.globalAlpha = aCard * (k === 0 ? 1 : 1 - 0.88 * near);
        g.fillStyle = k === 0 ? C.yellow : `rgb(${C.ink})`;
        g.beginPath(); g.arc(x + 9 * u, ly - 2.6 * u, 1.5 * u, 0, Math.PI * 2); g.fill();
        g.fillStyle = `rgb(${C.ink})`;
        g.font = `400 ${(7.6 * u).toFixed(2)}px Onest`;
        g.fillText(line, x + 15 * u, ly);
      });
    }
    g.globalAlpha = 1;
    return stop;
  }

  function seek(t) { draw(t); }
  // Where «your group» ends up, in the clip's pixels (the slide puts its live label «ваша группа» next to it).
  window.__scale = { focal: [groupX(FC) + CELL / 2, groupY(FR) + CELL / 2], STOPS_AT, MOVES, T };
  window.__clip = { T, seek, width: W, height: H, poster: T, loop: false };
  document.fonts.ready.then(() => {
    // Stop 1 holds the centre of the line's words: x + 15u to the end of the text, in world units.
    const U = 1000, u = (CARD_H * U) / 100;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.font = `400 ${(7.6 * u).toFixed(2)}px Onest`;
    const wWorld = g.measureText(LINES[0]).width / U;
    P[0] = [cardX + 9 * CARD_H / 100 + (6 * CARD_H / 100 + wWorld) / 2, lineY(0) - 2.6 * CARD_H / 100];
    seek(0);
  });
})();
</script>
</body>
</html>
