<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>landing-oral — the phone of «Ответ вслух, как на экзамене» on the landing's first screen</title>
<link rel="stylesheet" href="clip.css">
<link rel="stylesheet" href="landing-film.css">
<style>.win { border-radius: 0; box-shadow: none; } .tap { width: 96px; height: 96px; margin: -48px 0 0 -48px; } .cap, .dots { display: none; }</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script src="clip.js"></script>
<script src="../media/gen/footage/oral-take/take.js"></script>
<script src="landing-film.js"></script>
<script>
/* The phone on the landing's first screen (owner 19.11: «мне нравится концепция экрана телефона, но что-то тут не
   так» — the cut that stood there showed one moment of the answer, and the lower third of its screen was empty).
   The whole phone screen of the take the deck's slide 10 is cut from (oral-take: today's app, 390 × 844), in four
   steps: the answer aloud begins; the key points are heard as they are said (1 of 4, then 2 of 4); the examiner asks
   about the point named in part; the result, then one point with the student's words beside the lecture's.
   The steps' names are not in the picture: the page writes them beside the phone and lights the one that plays
   (frontend/src/lib/footage.ts LANDING_ORAL_STEPS — the seconds printed by this page as window.__film.steps).
   Rendered: node deck/cf11/motion/render.mjs landing-oral --fps 25 --jobs 1 --crf 16 */
const STAGE = [600, 1298], WIN = [0, 0, 600, 1298];
const { box, mark } = landingFilmTools(WIN);
// [the take's seconds from, to, how long it stands (its last frame held), the dissolve it comes in with, the step it opens]
const SHOTS = [
  [mark('listening') - 0.3, mark('listening') + 1.5, 2.5, 0, 0],      // 1: «Говорите — расшифровка появится здесь»
  [mark('heard-1') - 0.5, mark('heard-1') + 1.3, 2.5, 0.45, 1],       // 2: 1 of 4, the first words
  [mark('heard-2') - 0.4, mark('heard-2') + 1.2, 2.5, 0.45],          //    2 of 4
  [mark('asked') - 0.4, mark('asked') + 2.6, 3.7, 0.45, 2],           // 3: the examiner's question
  [mark('result') + 0.1, mark('result') + 2.3, 3.1, 0.45, 3],         // 4: the result
  [mark('points') + 0.2, mark('points') + 3.0, 3.8, 0.45],            //    a point: the student's words and the lecture's
];
const pieces = [];
const steps = [];
let at = 0;
for (const [m0, m1, stand, fade, step] of SHOTS) {
  const f0 = fade ? at - fade : at;
  pieces.push({ f0, m0, m1, fade });
  if (step !== undefined) steps.push(+(Math.max(0, f0 + (fade ? fade / 2 : 0))).toFixed(2));
  at = f0 + stand;
}
const T = at + 0.3;
landingFilm({
  footage: '../media/gen/footage/oral-take/', stage: STAGE, win: WIN, T, seam: 0.55, pieces, pointer: false,
  cam0: box(0, 0, 390),
  steps: steps.map((from, n) => ({ from: n ? from : -1, to: n + 1 < steps.length ? steps[n + 1] : T, text: '' })),
});
window.__film = { T, pieces, steps };
</script>
</body>
</html>
