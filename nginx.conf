server {
    listen 7860;
    server_name _;

    client_max_body_size 16m;

    # Meldy is also a Telegram Mini App (/tg; meldy-notes 10_Project/Telegram_Mini_App_Spec_2026-10-10.md, decision 12):
    # - script-src allows exactly Telegram's telegram-web-app.js (a path, not the host), which the app loads only
    #   in a Mini App session (frontend/src/lib/telegram/miniApp.ts);
    # - frame-ancestors lets Telegram Web (web.telegram.org) show the site in its frame and nobody else. It covers
    #   every page, because Telegram Web reloads the frame on the page the student is on. X-Frame-Options is not
    #   sent: it can only say DENY or SAMEORIGIN, and frame-ancestors takes its place.
    # - frame-src lets in exactly the three video players of the studio's video block (frontend/src/lib/studio/video.ts
    #   VIDEO_EMBED_ORIGINS: youtube-nocookie.com, rutube.ru, vkvideo.ru); every other frame stays out.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org/js/telegram-web-app.js; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; media-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://rutube.ru https://vkvideo.ru; frame-ancestors https://web.telegram.org; base-uri 'self'; form-action 'self' https://accounts.google.com" always;

    root /usr/share/nginx/html;
    index index.html;

    # Text travels compressed: the entry JS (~650 KB) and CSS (~270 KB) come to ~245 KB together.
    # Event streams (text/event-stream) are not in the list, so analysis progress stays a stream.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain;

    # API proxy → FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # The fallback way to Supabase when *.supabase.co is unreachable (backend/supabase_proxy.py).
    # No URI in proxy_pass: the path and query reach FastAPI exactly as the browser encoded them.
    location /sb/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Built files carry a content hash in their names: a year in the cache, never revalidated.
    # An add_header inside a location drops the server-level ones, so they are repeated here.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org/js/telegram-web-app.js; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; media-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://rutube.ru https://vkvideo.ru; frame-ancestors https://web.telegram.org; base-uri 'self'; form-action 'self' https://accounts.google.com" always;
    }

    # SPA fallback. The page and the service worker are checked on every visit, so a release
    # is picked up at once and an old page never asks for files the new build no longer has.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org/js/telegram-web-app.js; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; media-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://rutube.ru https://vkvideo.ru; frame-ancestors https://web.telegram.org; base-uri 'self'; form-action 'self' https://accounts.google.com" always;
    }
}
