/* The first screen of the landing v3. index.html carries this file inline (the static hero paints before any JS;

.h3{--h3-canvas:#f3f3f0;--h3-surface:#fff;--h3-ink:#0b121c;--h3-muted:#4b515b;--h3-line:#e3e3dd;--h3-blue:#2869dd;--h3-blue-d:#1c4db1;--h3-yellow:#f4c45b;min-height:100vh;overflow-x:clip;background:var(--h3-canvas);color:var(--h3-ink);font-family:'Onest Variable','Onest Fallback',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.dark .h3{--h3-canvas:#0b0f16;--h3-surface:#141a24;--h3-ink:#f3f3f0;--h3-muted:#a7adb7;--h3-line:#262e3b}
.h3 *,.h3 *::before,.h3 *::after{box-sizing:border-box}
.h3-wrap{width:100%;max-width:1360px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.h3-nav{position:sticky;top:0;z-index:30;background:var(--h3-canvas)}
.h3-nav-in{display:flex;align-items:center;gap:24px;height:68px}
.h3-logo{display:inline-flex;align-items:baseline;padding:8px 0;color:var(--h3-ink);font-size:28px;font-weight:600;letter-spacing:-.045em;line-height:1;text-decoration:none}
.h3-logo::after{content:'';display:inline-block;width:.3em;height:.3em;margin-left:.08em;border-radius:50%;background:var(--h3-yellow)}
.h3-links{display:flex;gap:4px;margin-left:12px}
.h3-links a{padding:8px 12px;border-radius:999px;color:var(--h3-ink);font-size:15px;font-weight:500;text-decoration:none}
.h3-links a:hover{background:var(--h3-surface)}
.h3-end{display:flex;gap:8px;margin-left:auto}
.h3-pill{display:inline-flex;align-items:center;justify-content:space-between;gap:14px;min-height:56px;padding:8px 9px 8px 24px;border:0;border-radius:999px;font-family:inherit;font-size:17px;font-weight:500;line-height:1.2;text-decoration:none;white-space:nowrap;cursor:pointer}
.h3-pill i{display:grid;flex:none;place-items:center;width:40px;height:40px;border-radius:50%}
.h3-pill svg{width:19px;height:19px}
.h3-pill--blue{background:var(--h3-blue);color:#fff}
.h3-pill--blue i{background:var(--h3-blue-d)}
.h3-pill--white{background:var(--h3-surface);color:var(--h3-ink);box-shadow:inset 0 0 0 1px var(--h3-line)}
.h3-pill--white i{background:var(--h3-ink);color:var(--h3-canvas)}
.h3-pill--sm{min-height:42px;padding:0 18px;font-size:15px}
.h3-hero{display:grid;gap:28px;padding-top:12px;padding-bottom:28px}
.h3-h1{margin:0;font-size:clamp(36px,4.4vw,64px);font-weight:500;letter-spacing:-.035em;line-height:1.04;text-wrap:balance}
.h3-lead{max-width:640px;margin:18px 0 0;color:var(--h3-muted);font-size:clamp(16px,1.35vw,19px);line-height:1.5}
.h3-acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-top:26px}
.h3-textlink{display:inline-flex;align-items:center;gap:8px;color:var(--h3-ink);font-size:16px;font-weight:500;text-decoration:none}
.h3-textlink svg{width:17px;height:17px}
.h3-reel-slot{min-width:0}
.h3-reel-wait{width:100%;aspect-ratio:16/9;border-radius:28px;background:#fbfbf9;box-shadow:0 0 0 1px rgba(11,18,28,.07)}
@media (min-width:1100px){.h3-hero{grid-template-columns:minmax(0,450px) minmax(0,1fr);align-items:start;gap:48px;padding-top:28px}.h3-h1{font-size:clamp(40px,3.7vw,56px)}.h3-acts{flex-direction:column;align-items:flex-start}}
@media (max-width:860px){.h3-links{display:none}}
@media (max-width:599px){.h3-nav-in{height:60px;gap:8px}.h3-logo{font-size:25px}.h3-end .h3-pill--sm{min-height:38px;padding:0 14px;font-size:14px}.h3-hero{gap:22px;padding-top:4px}.h3-acts{margin-top:20px}.h3-acts .h3-pill--blue{width:100%}.h3-reel-wait{aspect-ratio:4/5;border-radius:24px}}
.sh-off #static-hero{display:none}
html:not(.sh-off) #root>*{display:none}
