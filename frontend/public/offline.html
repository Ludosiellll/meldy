<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нет сети — Meldy</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f8fafc;
      color: #0f172a;
      text-align: center;
      padding: 20px;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      color: #94a3b8;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem 0;
    }
    p {
      color: #64748b;
      margin: 0 0 1.5rem 0;
      max-width: 300px;
    }
    button {
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #4338ca;
    }
  </style>
</head>
<body>
  <div class="icon">🔌</div>
  <h1>Нет подключения</h1>
  <p>Похоже, вы находитесь в офлайне. Проверьте подключение к интернету и попробуйте снова.</p>
  <button onclick="handleReload()">Обновить страницу</button>

  <script>
    // Self-healing function to recover from Service Worker routing deadlocks when online
    async function handleReload() {
      if (navigator.onLine) {
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (const registration of registrations) {
              await registration.unregister();
            }
            console.log('Service workers unregistered successfully to resolve deadlock.');
          }
        } catch (e) {
          console.error('Failed to unregister service worker:', e);
        }
      }
      window.location.reload();
    }

    // Auto-heal on page load if the user is actually online
    window.addEventListener('load', () => {
      if (navigator.onLine) {
        // To avoid infinite redirect loops in edge cases, check if we reloaded recently
        const lastAutoReload = sessionStorage.getItem('last_auto_reload');
        const now = Date.now();
        if (!lastAutoReload || (now - parseInt(lastAutoReload, 10) > 10000)) {
          sessionStorage.setItem('last_auto_reload', now.toString());
          handleReload();
        }
      }
    });
  </script>
</body>
</html>
