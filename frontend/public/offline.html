<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Нет сети — Meldy</title>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f4">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f1e1c">
  <style>
    :root {
      --sf-canvas: #f6f5f4;
      --sf-surface: #ffffff;
      --sf-ink: #20201e;
      --sf-muted: #696862;
      --sf-line: #e6e4e1;
      --sf-accent: #0868b2;
      --sf-accent-hover: #075b9b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --sf-canvas: #1f1e1c;
        --sf-surface: #282725;
        --sf-ink: #f2f0ec;
        --sf-muted: #b0ada6;
        --sf-line: #403e3a;
        --sf-accent: #176dae;
        --sf-accent-hover: #125c94;
      }
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      background-color: var(--sf-canvas);
      color: var(--sf-ink);
      padding: 16px;
    }
    .card {
      max-width: 360px;
      width: 100%;
      background: var(--sf-surface);
      border: 1px solid var(--sf-line);
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
    }
    .icon {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
      color: var(--sf-muted);
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 8px 0;
    }
    p {
      color: var(--sf-muted);
      margin: 0 0 20px 0;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    button {
      background-color: var(--sf-accent);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: var(--sf-accent-hover);
    }
    button:focus-visible {
      outline: 2px solid var(--sf-accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h.01"/>
      <path d="M8.5 16.43a5 5 0 0 1 7 0"/>
      <path d="M5 12.86a10 10 0 0 1 5.17-2.69"/>
      <path d="M19 12.86a10 10 0 0 0-2-1.43"/>
      <path d="M2 8.82a15 15 0 0 1 4.18-2.65"/>
      <path d="M22 8.82a15 15 0 0 0-11.29-3.76"/>
      <path d="m2 2 20 20"/>
    </svg>
    <h1>Нет подключения</h1>
    <p>Похоже, интернет пропал. Проверьте подключение и обновите страницу.</p>
    <button type="button" onclick="handleReload()">Обновить страницу</button>
  </main>

  <script>
    // Self-healing function to recover from Service Worker routing deadlocks when online
    async function handleReload() {
      if (navigator.onLine) {
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            for (const registration of registrations) {
              await registration.unregister();
            }
            console.log('Service workers unregistered successfully to resolve deadlock.');
          }
        } catch (e) {
          console.error('Failed to unregister service worker:', e);
        }
      }
      window.location.reload();
    }

    // Auto-heal on page load if the user is actually online
    window.addEventListener('load', () => {
      if (navigator.onLine) {
        // To avoid infinite redirect loops in edge cases, check if we reloaded recently
        const lastAutoReload = sessionStorage.getItem('last_auto_reload');
        const now = Date.now();
        if (!lastAutoReload || (now - parseInt(lastAutoReload, 10) > 10000)) {
          sessionStorage.setItem('last_auto_reload', now.toString());
          handleReload();
        }
      }
    });
  </script>
</body>
</html>
